\n   la population.</p>\n<hr />\n"}, {"titre": "6. Le répertoire d'enquêtes", "html": "<h2>6. Le répertoire d'enquêtes</h2>\n<p>Comme en histoire des sciences, les exemples sont la matière de l'examen. Une\nquestion de cours attend une enquête nommée, datée, avec son dispositif.</p>\n<table>\n<thead>\n<tr>\n<th>Enquête</th>\n<th>Dispositif</th>\n<th>Résultat à citer</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Michelat &amp; Simon (1971)</strong></td>\n<td>77 Français, « qu'est-ce que la politique ? »</td>\n<td>Deux pôles structurants : catholiques déclarés à droite, irréligieux communisants à gauche. L'orientation politique fortement déterminée par le rapport au religieux</td>\n</tr>\n<tr>\n<td><strong>Nonna Mayer (1986)</strong></td>\n<td>30 petits commerçants, deux quartiers de Paris</td>\n<td>Discours très typés : quête d'indépendance, déboires avec les contrôles et le fisc, amertume face aux privilèges des salariés</td>\n</tr>\n<tr>\n<td><strong>Kaufmann (2002)</strong></td>\n<td>très longs entretiens, 20 couples, l'entretien du linge</td>\n<td>Au-delà de l'inégalité constatée, le pourquoi : intégration et reproduction des rôles sociaux appris à la socialisation</td>\n</tr>\n<tr>\n<td><strong>Lazarsfeld (1944)</strong></td>\n<td>panel, un comté de l'Ohio, 6 vagues sur 6 mois</td>\n<td>La majorité des électeurs sait déjà pour qui elle votera avant la campagne ; le vote est déterminé par les milieux sociaux</td>\n</tr>\n<tr>\n<td><strong>Girard (1964)</strong></td>\n<td>couples mariés entre 1945 et 1959</td>\n<td>L'<strong>homogamie sociale</strong>, contre le mythe du prince charmant. Confirmée par Bozon et Héran (2006)</td>\n</tr>\n<tr>\n<td><strong>Barnes &amp; Kaase (1979)</strong></td>\n<td>actions protestataires dans cinq pays</td>\n<td>Contre le stéréotype de l'activisme ouvrier : plus on appartient à des catégories favorisées, plus on participe à l'action protestataire</td>\n</tr>\n<tr>\n<td><strong>Stouffer</strong></td>\n<td>armée américaine, Seconde Guerre mondiale</td>\n<td>Devenu le cas d'école de l'<strong>analyse secondaire</strong> de données</td>\n</tr>\n<tr>\n<td><strong>Pasquali (2010)</strong></td>\n<td>« Les déplacés de l'ouverture sociale » — CPGE expérimentale créée en 2002 dans un lycée de province, réservée à des bacheliers de ZEP, dans un établissement où deux tiers des élèves viennent de milieux supérieurs</td>\n<td>Que fait l'ouverture sociale à ceux qui en bénéficient — les « déplacés » ? Cas de référence du cours pour le qualitatif</td>\n</tr>\n<tr>\n<td><strong>Desjeux (2006)</strong></td>\n<td>maquillage adolescent</td>\n<td>Trois occurrences coexistantes, preuve par occurrence</td>\n</tr>\n</tbody>\n</table>\n<p>Repères historiques du quantitatif : recensements depuis l'Antiquité, outils du\npouvoir avant d'être scientifiques · fin du XIXe, émergence des enquêtes par\néchantillon · 1910-1930, maîtrise de la représentativité · juillet 1935,\n<em>Fortune</em> publie des enquêtes sur 4 000 Américains.</p>\n<hr />\n"}, {"titre": "7. Séquence de travail", "html": "<h2>7. Séquence de travail</h2>\n<ol>\n<li><strong>Le clivage Weber / Durkheim</strong>, jusqu'à pouvoir le poser et le dépasser à\n   froid. C'est la matrice de tout le cours.</li>\n<li><strong>La réflexivité</strong>, définition exacte et les deux niveaux. Elle traverse les\n   six séances, donc elle tombera.</li>\n<li><strong>La chaîne d'opérationnalisation en quatre étapes</strong>, appliquée à un concept\n   de ton choix pour vérifier que tu sais la dérouler seul.</li>\n<li><strong>Le répertoire d'enquêtes</strong> en cartes de rappel actif — nom, date,\n   dispositif, résultat. C'est exactement le format d'un QCM.</li>\n<li><strong>L'oral, dès que le sujet est connu</strong> : problématique au modèle de la\n   section 5, puis opérationnalisation. Le rétroplanning se pose dans le\n   cockpit avec une échéance intermédiaire, sinon il se fera la veille.</li>\n</ol>\n<hr />\n"}, {"titre": "8. Programme des séances", "html": "<h2>8. Programme des séances</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Contenu</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Introduction : définition, réflexivité, clivage qualitatif / quantitatif</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Qualitatif I : spécificités, généralisation, quand choisir, trois usages de la réflexivité</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Qualitatif II : observation directe et entretien, exemple détaillé</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Quantitatif I : histoire, opérationnalisation, réflexivité du quantitativiste, analyse secondaire</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Quantitatif II : élaboration et structure du questionnaire, formulation des questions, cas des précarités étudiantes</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Méthodes mixtes : combiner qualitatif et quantitatif</td>\n</tr>\n</tbody>\n</table>\n<hr />\n"}, {"titre": "9. La séance 6 — les méthodes mixtes", "html": "<h2>9. La séance 6 — les méthodes mixtes</h2>\n<p><strong>Définition stricte :</strong> combiner au moins deux méthodes, une qualitative et\nune quantitative, <strong>dans un même travail publié</strong>. En dessous, on parle de\n« multiméthodes ».</p>\n<p><strong>Historique à situer.</strong> Le clivage se cristallise dans les années 1970\n(constructivisme contre positivisme). Après une trentaine d'années de « guerre\ndes paradigmes », des « thèses de la compatibilité » rouvrent la voie,\ndéveloppées soit inductivement (nécessité du terrain), soit déductivement\n(réflexion sur le design de recherche). Repère : 2007, création du <em>Journal of\nMixed Methods Research</em>. Le cours note qu'elles sont devenues centrales en\nsciences humaines et sociales depuis les années 2000 — <strong>sauf en économie</strong>.</p>\n<p><strong>Deux axes de combinaison.</strong> Séquentielle (qualitatif puis quantitatif, ou\nl'inverse) ou concomitante. Et, selon Mario Small, la mixité joue à deux\nniveaux : la <strong>collecte</strong> (terrain plus archives) et le <strong>traitement</strong>\n(entretiens plus régression).</p>\n<p><strong>Les cinq fonctions de Greene, Caracelli &amp; Graham</strong> — à savoir lister :</p>\n<table>\n<thead>\n<tr>\n<th>Fonction</th>\n<th>Logique</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Triangulation</td>\n<td>convergence et corroboration des résultats</td>\n</tr>\n<tr>\n<td>Complémentarité</td>\n<td>conforter ou clarifier les résultats d'une méthode par une autre</td>\n</tr>\n<tr>\n<td>Développement</td>\n<td>utiliser les résultats d'une méthode pour en construire une autre</td>\n</tr>\n<tr>\n<td>Initiation</td>\n<td>faire émerger paradoxes et contradictions</td>\n</tr>\n<tr>\n<td>Expansion</td>\n<td>étendre le champ d'application des résultats</td>\n</tr>\n</tbody>\n</table>\n<p>Distinction fine mais interrogeable : deux méthodes mobilisées en parallèle sur\n<strong>une même question</strong> relèvent de la triangulation ; sur <strong>plusieurs questions</strong>,\nde la complémentarité.</p>"}]}, {"cle": "sciences", "titre": "Histoire des sciences", "sousTitre": "Laude-Depezay", "sections": [{"titre": "Ouverture", "html": "<p>Enseignante : Audrey Laude-Depezay · 20 h CM · <strong>Partiel unique d'1 h 30,\nquestions de cours et de réflexion</strong></p>\n<p>Établi à partir des neuf supports de diapositives. Ce qui a été souligné à\nl'oral en CM n'y figure évidemment pas — à compléter avec tes notes.</p>\n<hr />\n"}, {"titre": "1. Comment ce cours est réellement construit", "html": "<h2>1. Comment ce cours est réellement construit</h2>\n<p>Le plan annoncé est chronologique, mais la matière ne l'est pas. Elle se\ndécompose en deux ensembles qui ne s'apprennent pas de la même façon.</p>\n<p><strong>Le cadre — parties 1, 8, 9.</strong> Les outils conceptuels : types de\nraisonnement, structure des révolutions scientifiques, critères de démarcation,\nintégrité et éthique. C'est un contenu de nature philosophique, peu volumineux,\nqui se maîtrise <strong>à froid</strong> — on doit pouvoir le restituer sans support.</p>\n<p><strong>Le corps — parties 2 à 7.</strong> Le déroulé historique, de l'Antiquité au XXIe\nsiècle. Volumineux, mais son rôle est instrumental : il fournit les épisodes\nqui <strong>illustrent</strong> le cadre.</p>\n<p>La conséquence est directe. Les questions de cours portent sur les deux ; les\nquestions de réflexion se traitent avec le cadre et se justifient par le corps.\nUn étudiant qui révise dans l'ordre des parties apprend le corps sans le cadre,\net se retrouve à réciter des dates devant une question qui demandait un\nraisonnement.</p>\n<p><strong>Ordre de travail : le cadre d'abord (1, 8, 9), le corps ensuite (2 à 7), en\nrécoltant au passage les exemples.</strong></p>\n<hr />\n"}, {"titre": "2. Le cadre — à savoir à froid", "html": "<h2>2. Le cadre — à savoir à froid</h2>\n<h3>2.1 Qu'est-ce qu'une science (partie 1)</h3>\n<ul>\n<li>Définition retenue : ensemble de connaissances d'une valeur universelle,\n  caractérisées par un objet et une méthode déterminés, fondées sur des\n  relations <strong>objectives et vérifiables</strong>. Le point discriminant est le\n  dernier : c'est ce qui sépare science et croyance.</li>\n<li>Comte (1830) : deux manières d'exposer une science, la <strong>marche historique</strong>\n  (l'ordre dans lequel l'esprit humain a réellement obtenu les connaissances)\n  et la <strong>marche dogmatique</strong> (le système d'idées tel qu'on le reconstruirait\n  aujourd'hui). L'enseignement adopte majoritairement la seconde.</li>\n<li>Risque de l'approche dogmatique : exposer les résultats sans les preuves\n  transforme les faits scientifiques en opinions. L'histoire restitue les essais\n  et les erreurs.</li>\n<li><strong>Classification des sciences</strong>, à restituer telle quelle :</li>\n<li><strong>Sciences formelles</strong> (mathématiques, logique) — relative indépendance\n    vis-à-vis du réel, le cercle parfait n'existe pas dans la nature ; elles\n    étudient des relations entre concepts ; raisonnement dominant\n    hypothético-déductif.</li>\n<li><strong>Sciences empiriques</strong> — se rapportent à l'expérience sensible ;\n    raisonnement dominant inductif. Elles se divisent en sciences de la Nature\n    et sciences de l'Homme et de la Société, ces dernières affrontant trois\n    difficultés propres : expériences parfois impossibles, subjectivité du\n    chercheur, effet observateur.</li>\n<li><strong>Fondamentales contre appliquées</strong> — les premières visent la compréhension\n    sans application immédiate. Elles irriguent les secondes sans être rentables\n    à court terme : Faraday et l'électromagnétisme, à l'origine des moteurs\n    électriques bien après lui. Une même discipline peut avoir les deux\n    versants.</li>\n</ul>\n<h3>2.2 Les quatre raisonnements (partie 1) — le noyau du cours</h3>\n<p>Deux raisonnements valides, deux « faux » mais utiles.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Forme</th>\n<th>Points de vigilance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Déduction</strong></td>\n<td><code>p ⟹ q</code> — si p est vraie, q survient nécessairement</td>\n<td>Ne jamais inverser : q vérifié ne permet pas de conclure que p est vraie</td>\n</tr>\n<tr>\n<td><strong>Induction</strong></td>\n<td>Généraliser</td>\n<td>Distinguer <strong>amplifiante</strong> (vraie dans tous les cas observés, donc supposée toujours vraie — la plus courante) et <strong>totalisante</strong> (tous les cas individuels ont été observés)</td>\n</tr>\n<tr>\n<td><strong>Abduction</strong> (Peirce)</td>\n<td>Le fait surprenant C est observé ; or si A est vrai, C est certain ; il y a donc raison de soupçonner A</td>\n<td>Deux usages : <strong>créative</strong> (former une hypothèse à vérifier) et <strong>de corroboration</strong> (rendre A plus plausible, comme l'enquêteur accumulant des indices)</td>\n</tr>\n<tr>\n<td><strong>Analogie</strong></td>\n<td>Transport d'une structure d'un domaine à un autre</td>\n<td>Reconnue non concluante</td>\n</tr>\n</tbody>\n</table>\n<p>Test d'acquisition : sur feuille blanche, poser les quatre, donner un exemple\nde chacun, et expliquer pourquoi l'affirmation du conséquent est une erreur.</p>\n<h3>2.2 bis La sérendipité</h3>\n<p><strong>Définition :</strong> capacité à faire par hasard une découverte inattendue <strong>et à en\nsaisir l'utilité</strong>. Le second membre est essentiel et c'est lui qu'on oublie.\nTerme forgé par Horace Walpole en 1754.</p>\n<p>Cas canonique : la pénicilline, Fleming, 1928 — une culture de staphylocoques\naccidentellement contaminée par un champignon échappé du laboratoire d'un\ncollègue. Et la formule de Pasteur (1854) qui doit accompagner toute réponse sur\nle sujet : <strong>le hasard ne favorise que les esprits préparés</strong>.</p>\n<h3>2.2 ter Tester une hypothèse — le cas Semmelweis</h3>\n<p>C'est le cas d'école du cours : il montre la démarche complète, échecs compris.</p>\n<p>Ignace Semmelweis, hôpital de Vienne, 1844-1848. Il observe que l'un des deux\nservices d'obstétrique affiche une mortalité par fièvre puerpérale bien plus\nélevée que l'autre — <strong>8,2 % contre 2,3 % en 1844</strong>.</p>\n<ol>\n<li>Premier groupe d'hypothèses — influences « épidémiques », entassement,\n   régime alimentaire : <strong>réfutées</strong>, ces facteurs ne différant pas entre les\n   deux services.</li>\n<li>Second groupe — le prêtre traversant les salles, la position d'accouchement :\n   testées en changeant les pratiques, aucun changement observé, <strong>invalidées</strong>.</li>\n<li>Découverte accidentelle — un médecin blessé par le scalpel d'un étudiant en\n   autopsie meurt de fièvre puerpérale. Semmelweis en déduit qu'une « matière\n   cadavérique » contamine le sang, impose le lavage des mains au chlorure de\n   chaux : <strong>la mortalité chute à 1,27 %</strong>. C'est la découverte de l'asepsie.</li>\n</ol>\n<p><strong>Le raisonnement hypothético-déductif, formalisé :</strong> hypothèse (H) ⟹ déduction\n(Cd) ⟹ conséquence testable (R).\n- Si R n'est <strong>pas</strong> obtenu : H est réfutée <strong>avec certitude</strong>.\n- Si R <strong>est</strong> obtenu : on ne peut rien conclure avec certitude, H est seulement\n  <strong>corroborée</strong>.</p>\n<p>Cette asymétrie est exactement le principe de Popper, et le cas Semmelweis en\nest l'illustration historique. Les relier en copie est l'un des rapprochements\nles plus rentables du cours.</p>\n<h3>2.3 Kuhn et la structure des révolutions (partie 8)</h3>\n<p><em>La Structure des révolutions scientifiques</em>, 1962.</p>\n<p>D'abord ce que Kuhn conteste : la vision cumulative, selon laquelle la science\nprogresserait linéairement en éliminant peu à peu les erreurs, certaines\nthéories devenant des consensus sans cesse corroborés. Elle est jugée\n<strong>incomplète</strong> : elle explique mal les révolutions attestées par l'histoire.</p>\n<p>Le cycle :</p>\n<pre><code>Préscience          plusieurs conceptions concurrentes coexistent\n   ↓                (ex : autant de conceptions de l'électricité\n                     que d'expérimentateurs importants)\nParadigme           une science mûre est guidée par un paradigme unique\n   ↓\nScience normale     on étend le paradigme, on ne cherche pas à le réfuter ;\n   ↓                les anomalies sont expliquées à l'intérieur\nAnomalies           soit accumulation, soit une anomalie touchant les bases\n   ↓\nCrise               grande insécurité, controverses, interprétations rivales\n   ↓\nRévolution          nouveau paradigme ; on ne peut pas tenir les deux\n                    visions simultanément\n</code></pre>\n<p>Composition d'un paradigme, sur l'exemple newtonien : une <strong>croyance</strong> (le\nmonde physique s'explique comme un système mécanique régi par les lois du\nmouvement), des <strong>lois</strong>, une <strong>méthode d'application</strong> de ces lois, une\n<strong>instrumentation</strong> et des techniques expérimentales.</p>\n<h3>2.4 Démarcation et pseudo-sciences (partie 9)</h3>\n<ul>\n<li>Le <strong>falsificationnisme de Popper</strong> comme critère : une théorie est\n  scientifique si elle est réfutable. Principe central, à citer mot pour mot :\n  <strong>on peut prouver qu'une théorie est fausse, mais jamais qu'elle est vraie.</strong>\n  Une expérience réussie ne fait qu'augmenter la vraisemblance — elle\n  <em>corrobore</em> ; une seule expérience qui échoue peut suffire à réfuter.\n  Les deux exemples du cours : « tous les métaux chauffés se dilatent »\n  (falsifiable et corroboré) contre « toutes les fleurs sont roses »\n  (falsifiable et falsifié). Le critère fonctionne en partie — certaines\n  hypothèses des pseudo-sciences ne peuvent être testées — mais il a des\n  limites, notamment pour une théorie jeune.</li>\n<li>D'où une approche par <strong>faisceau de signaux d'alerte</strong> plutôt que par critère\n  unique : ajout d'hypothèses <em>ad hoc</em> pour échapper à la réfutation (rasoir\n  d'Occam), absence d'auto-correction, évitement de la relecture par les pairs.</li>\n<li>Les pseudo-sciences comme <strong>vestiges d'anciennes sciences</strong>, fondées sur des\n  théories qui ne sont plus valides : alchimie, astrologie, vitalisme et\n  naturopathie.</li>\n<li><strong>Fabrique du doute</strong> et lobbying : produire de l'incertitude sans produire de\n  science.</li>\n</ul>\n<h3>2.5 Éthique et intégrité (partie 9)</h3>\n<p>Trois notions à ne surtout pas confondre — c'est un piège de question de cours :</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Objet</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Intégrité de la recherche</strong></td>\n<td>les bonnes pratiques et les principes</td>\n</tr>\n<tr>\n<td><strong>Éthique de la recherche</strong></td>\n<td>les valeurs de la recherche</td>\n</tr>\n<tr>\n<td><strong>Responsabilité sociale</strong></td>\n<td>les conséquences de la recherche pour la société</td>\n</tr>\n</tbody>\n</table>\n<p>Critères d'absence de crédibilité scientifique : pas de protocole clair, non\nreproductible, données falsifiées, conclusions incohérentes avec les données.</p>\n<p>Cas mobilisables : expérimentations en camp de concentration\n(Natzweiler-Struthof, et atrocités comparables en Chine), expérience de Milgram\nsur la soumission à l'autorité.</p>\n<hr />\n"}, {"titre": "3. Le corps historique — ce qu'on va y chercher", "html": "<h2>3. Le corps historique — ce qu'on va y chercher</h2>\n<table>\n<thead>\n<tr>\n<th>Partie</th>\n<th>Période</th>\n<th>Ce qu'il faut en retenir en priorité</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2</td>\n<td>Antiquité et repères</td>\n<td>Grèce présocratique (avant −500), période classique (−500 / −338), période hellénistique (−338 / −30). Maïeutique et <em>elenchos</em> socratiques · Platon, monde sensible contre monde intelligible · Aristote, les quatre causes (matérielle, formelle, efficiente, finale) · Euclide, méthode axiomatique · théorie des humeurs. Et la thèse transversale : <strong>les controverses sont le moteur de l'évolution des sciences</strong></td>\n</tr>\n<tr>\n<td>3</td>\n<td>Médiévale</td>\n<td>Division de l'empire romain (395), chute de l'Occident, <strong>âge d'or islamique</strong>, Moyen-Âge occidental</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Renaissance</td>\n<td>1453, prise de Constantinople · <strong>révolution copernicienne</strong> · mécanique · médecine et anatomie · organisation des savants · <strong>Bacon contre Descartes</strong></td>\n</tr>\n<tr>\n<td>5</td>\n<td>XVIIIe, Lumières</td>\n<td>Glorieuse révolution anglaise (1688-89), mort de Louis XIV (1715), contestation sociale et intellectuelle</td>\n</tr>\n<tr>\n<td>6</td>\n<td>XIXe</td>\n<td>Révolution industrielle et méthode expérimentale · <strong>catastrophisme contre uniformitarisme</strong> · évolution, fin de la génération spontanée, débuts de la génétique · <strong>controverse sur les atomes</strong>, classification des éléments</td>\n</tr>\n<tr>\n<td>7</td>\n<td>XXe-XXIe</td>\n<td>Électron (1897), noyau de Rutherford (1911), quantique, relativité, Big Bang · informatique · hypothèse, déduction et <strong>expérience de pensée</strong> · édition scientifique</td>\n</tr>\n</tbody>\n</table>\n<p>Le couple Bacon / Descartes en partie 4 est le point de jonction explicite entre\nle cadre et le corps : c'est l'opposition induction / déduction incarnée\nhistoriquement. À traiter en priorité dans tout le corps.</p>\n<hr />\n"}, {"titre": "4. La grille d'exemples", "html": "<h2>4. La grille d'exemples</h2>\n<p>C'est l'outil de la question de réflexion. Une question de réflexion se\ncompose d'une notion du cadre plus un exemple du corps ; cette grille les\napparie à l'avance.</p>\n<table>\n<thead>\n<tr>\n<th>Notion du cadre</th>\n<th>Épisodes mobilisables</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Déduction</td>\n<td>Descartes (P4) ; physique d'Aristote</td>\n</tr>\n<tr>\n<td>Induction</td>\n<td>Bacon (P4) ; méthode expérimentale du XIXe (P6)</td>\n</tr>\n<tr>\n<td>Abduction</td>\n<td>Pasteur lisant Pline sur le chauffage des vins romains, d'où la pasteurisation (P1)</td>\n</tr>\n<tr>\n<td>Sérendipité</td>\n<td>Fleming et la pénicilline, 1928 (P1)</td>\n</tr>\n<tr>\n<td>Hypothético-déductif, réfutation</td>\n<td><strong>Semmelweis</strong>, Vienne 1844-1848 (P1) — le cas le plus complet du cours</td>\n</tr>\n<tr>\n<td>Méthode axiomatique</td>\n<td>Euclide (Antiquité)</td>\n</tr>\n<tr>\n<td>Modèle réfuté par l'expérience</td>\n<td>Théorie des humeurs (Antiquité, médecine)</td>\n</tr>\n<tr>\n<td>Préscience, visions concurrentes</td>\n<td>Les conceptions de l'électricité (P8)</td>\n</tr>\n<tr>\n<td>Paradigme et science normale</td>\n<td>Paradigme newtonien (P8) ; géocentrisme de Ptolémée (P4, P8)</td>\n</tr>\n<tr>\n<td>Anomalie, crise, révolution</td>\n<td>Géocentrisme → héliocentrisme (P4, P8) · Aristote → Newton → Einstein (P7, P8) · fixisme → Darwin (P6) · génération spontanée → Pasteur (P6)</td>\n</tr>\n<tr>\n<td>Controverse comme moteur</td>\n<td>Catastrophisme contre uniformitarisme (P6) ; controverse sur les atomes (P6)</td>\n</tr>\n<tr>\n<td>Falsifiabilité, démarcation</td>\n<td>Astrologie, alchimie, vitalisme (P9)</td>\n</tr>\n<tr>\n<td>Intégrité et éthique</td>\n<td>Natzweiler-Struthof, Milgram (P9)</td>\n</tr>\n<tr>\n<td>Mythes à défaire</td>\n<td>Le génie solitaire ; l'absence des femmes (P1)</td>\n</tr>\n</tbody>\n</table>\n<p>Un même épisode sert plusieurs notions — l'héliocentrisme illustre aussi bien\nla révolution kuhnienne que la controverse. C'est normal et c'est une force :\nun exemple bien maîtrisé se replace dans plusieurs questions.</p>\n<hr />\n"}, {"titre": "5. Séquence de travail", "html": "<h2>5. Séquence de travail</h2>\n<ol>\n<li><strong>Partie 1</strong> — les quatre raisonnements, jusqu'à restitution à froid. C'est\n   le plus rentable du cours : le titre même de l'UE l'annonce.</li>\n<li><strong>Parties 8 et 9</strong> — Kuhn, démarcation, éthique. Toujours à froid.</li>\n<li><strong>Parties 2 à 7</strong> — une passe rapide, en remplissant la grille d'exemples\n   au fur et à mesure plutôt qu'en fichant tout.</li>\n<li><strong>Partie 4 en priorité</strong> dans le corps, pour Bacon / Descartes.</li>\n<li>Cartes de rappel actif sur le cadre uniquement — les dates du corps\n   s'ancrent par les exemples, pas par la répétition isolée.</li>\n<li>Entraînement : se poser des questions de réflexion et y répondre en\n   dix minutes, à l'écrit. Le format du partiel est là-dessus.</li>\n</ol>\n<hr />\n"}, {"titre": "6. Dans le cockpit", "html": "<h2>6. Dans le cockpit</h2>\n<p>Une seule évaluation pour cette UE, pas deux : partiel d'1 h 30. Avec une\népreuve unique, la note requise pour atteindre la cible <strong>est</strong> la cible — le\nbarème inverse n'a aucune marge à jouer. C'est une UE où tout se joue le\njour J.</p>"}]}, {"cle": "synthese", "titre": "Synthèse transversale", "sousTitre": "Sciences × Enquête", "sections": [{"titre": "Ouverture", "html": "<p>Deux UE distinctes, deux enseignants, deux corpus — et pourtant la même\nquestion de fond, posée deux fois sous deux angles : <em>comment sait-on qu'on\nsait ?</em> L'une la pose côté sciences de la nature, l'autre côté sciences\nsociales. Les réviser ensemble coûte moins cher que de les réviser séparément,\nparce que comprendre l'une éclaire directement l'autre.</p>\n<p>Ce document ne remplace aucune des deux cartes de cours — il les met en\nregard. S'y référer une fois les deux cartes travaillées séparément, pas avant.</p>\n<hr />\n"}, {"titre": "1. Le même clivage, deux vocabulaires", "html": "<h2>1. Le même clivage, deux vocabulaires</h2>\n<table>\n<thead>\n<tr>\n<th>Histoire des sciences</th>\n<th>Techniques d'enquête</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sciences <strong>formelles</strong> — raisonnement hypothético-déductif</td>\n<td><em>(pas d'équivalent direct)</em></td>\n</tr>\n<tr>\n<td>Sciences <strong>empiriques</strong> — observation, expérience, raisonnement inductif</td>\n<td>Approche <strong>quantitative</strong> — Durkheim, « traiter les faits sociaux comme des choses »</td>\n</tr>\n<tr>\n<td><em>(pas d'équivalent direct)</em></td>\n<td>Approche <strong>qualitative</strong> — Weber, <em>Verstehen</em>, comprendre le sens donné par les acteurs</td>\n</tr>\n<tr>\n<td><strong>Déduction</strong> — de la loi générale au cas particulier</td>\n<td><em>(logique du raisonnement hypothético-déductif dans la construction du questionnaire)</em></td>\n</tr>\n<tr>\n<td><strong>Induction</strong> — du cas particulier à la loi générale</td>\n<td>Démarche quantitative classique : observer des covariations, en tirer une régularité</td>\n</tr>\n</tbody>\n</table>\n<p>Le point commun exact : la distinction sciences empiriques / sciences\nformelles en Histoire des sciences repose sur le <strong>type de raisonnement</strong>\nmobilisé. La distinction qualitatif / quantitatif en Techniques d'enquête\nrepose sur le <strong>rapport à l'objet</strong> — expliquer de l'extérieur ou comprendre de\nl'intérieur. Ce ne sont pas la même coupure, et une question de réflexion qui\nles confondrait serait fausse. Mais toutes deux opposent une logique qui\ngénéralise objectivement à une logique qui reste au plus près du cas.</p>\n<p><strong>Le dépassement, dans les deux cours, suit la même forme.</strong> Techniques\nd'enquête refuse le clivage qualitatif/quantitatif comme verdict final : la\n« compréhension explicative » wébérienne appliquée aux chiffres, puis les\nméthodes mixtes en séance 6. Histoire des sciences fait le même geste avec\nKuhn : la science ne progresse pas par accumulation linéaire d'un seul type de\nraisonnement, elle traverse des ruptures. Une question qui demande de\n« dépasser une opposition binaire » se traite avec la même structure en\nrhétorique dans les deux UE, seul le contenu change.</p>\n<hr />\n"}, {"titre": "2. Durkheim est un cas d'école de démarcation", "html": "<h2>2. Durkheim est un cas d'école de démarcation</h2>\n<p>C'est la connexion la plus directe, et la plus rentable en examen.</p>\n<p>Durkheim, « traiter les faits sociaux comme des choses », <strong>est</strong> un\nprogramme de scientificité au sens où Histoire des sciences la définit : des\nrelations objectives et vérifiables. La méthode par échantillon,\nopérationnalisation, covariations mesurables — tout ce que Techniques\nd'enquête présente comme technique quantitative est, vu depuis Histoire des\nsciences, une <strong>application du critère de démarcation</strong> à un objet social.</p>\n<p>Symétriquement : les limites de la généralisation en qualitatif (on construit\ndes typologies, on ne peut pas en évaluer les proportions dans la population)\nsont un exemple concret de ce que Popper vise quand il distingue une théorie\nréfutable d'une théorie qui ne l'est pas. Une typologie qualitative n'est pas\nfausse — elle n'est simplement pas du même ordre de vérifiabilité qu'une\ncovariation statistique. C'est un argument tout fait pour une question du type\n« le qualitatif est-il moins scientifique que le quantitatif ? », qui piège\nprécisément les étudiants qui n'ont pas fait ce lien.</p>\n<hr />\n"}, {"titre": "3. Réflexivité et intégrité : la même vigilance, deux échelles", "html": "<h2>3. Réflexivité et intégrité : la même vigilance, deux échelles</h2>\n<p><strong>Techniques d'enquête</strong> fait de la réflexivité un fil transversal : le sujet\nqui se prend pour objet, à deux niveaux — sa propre pratique, et les conditions\nsociales de toute production intellectuelle (Bourdieu).</p>\n<p><strong>Histoire des sciences</strong> traite un objet voisin sous un autre nom : intégrité\net éthique de la recherche, la fabrique du doute, les critères d'absence de\ncrédibilité scientifique.</p>\n<p>Le lien : la réflexivité wébérienne-bourdieusienne est la version\n<em>méthodologique</em> de ce que Histoire des sciences traite comme problème\n<em>éthique</em>. Dans les deux cas, la question est : qu'est-ce qui, dans la\nposition du chercheur, peut fausser ce qu'il produit ? Techniques d'enquête\nrépond en amont — se connaître soi-même pour bien construire l'enquête.\nHistoire des sciences répond en aval — reconnaître les signaux d'une\nproduction biaisée une fois qu'elle existe (données falsifiées, absence\nd'auto-correction, évitement de la relecture par les pairs).</p>\n<p>Une question qui demanderait « pourquoi la rigueur scientifique exige-t-elle\nun rapport critique à soi-même ? » se répond avec les deux cours en même temps.</p>\n<hr />\n"}, {"titre": "4. L'histoire comme méthode, dans les deux cours", "html": "<h2>4. L'histoire comme méthode, dans les deux cours</h2>\n<p>Comte distingue marche historique (l'ordre réel de découverte) et marche\ndogmatique (le système reconstruit). Techniques d'enquête applique\nsilencieusement la même logique à sa propre discipline : retracer l'histoire\ndu quantitatif — recensements antiques, essor de l'échantillonnage au tournant\ndu XXe siècle, enquêtes <em>Fortune</em> de 1935 — n'est pas un habillage historique,\nc'est la <strong>marche historique</strong> de la méthode elle-même, par opposition à un\nexposé purement technique du questionnaire (la marche dogmatique).</p>\n<p>Comprendre ce parallèle donne une phrase de transition utilisable dans les deux\ncopies : présenter une méthode par son histoire plutôt que par son seul\nrésultat, c'est déjà prendre position sur la façon dont la science se\nconstruit.</p>\n<hr />\n"}, {"titre": "5. Ce qu'il ne faut pas fusionner", "html": "<h2>5. Ce qu'il ne faut pas fusionner</h2>\n<p>Pour ne pas produire de confusion en copie :</p>\n<ul>\n<li>Le clivage sciences formelles / empiriques n'est <strong>pas</strong> le clivage\n  qualitatif / quantitatif — l'un porte sur le type de raisonnement, l'autre\n  sur le rapport à l'objet observé.</li>\n<li>L'abduction (Peirce) n'a pas d'équivalent nommé en Techniques d'enquête —\n  ne pas l'y plaquer artificiellement.</li>\n<li>Kuhn décrit l'évolution d'une discipline dans le temps long ; le clivage\n  qual/quant décrit une coexistence de méthodes à un instant donné. Les\n  rapprocher pour la structure de l'argument (dépasser une opposition), pas\n  pour le contenu.</li>\n</ul>\n<hr />\n"}, {"titre": "6. Comment réviser les deux ensemble", "html": "<h2>6. Comment réviser les deux ensemble</h2>\n<ol>\n<li>Travailler chaque carte séparément jusqu'au test d'acquisition qu'elle\n   propose.</li>\n<li>Une seule séance dédiée à ce document, en fin de parcours : reconstituer\n   de mémoire les sections 2 et 3 ci-dessus, sans les relire.</li>\n<li>À l'entraînement sur annales, s'entraîner spécifiquement à une question qui\n   demanderait de mobiliser les deux — c'est le type de question qu'un\n   partiel de réflexion pose volontiers quand deux UE du même semestre\n   partagent un thème.</li>\n</ol>"}]}, {"cle": "moodle", "titre": "Inventaire Moodle", "sousTitre": "S3 — relevé du 21 octobre", "sections": [{"titre": "Ouverture", "html": "<p>Relevé le 21 octobre 2026 sur <code>cours.univ-reims.fr</code>. Les identifiants permettent\nd'ouvrir directement un cours : <code>cours.univ-reims.fr/course/view.php?id=&lt;id&gt;</code>.</p>\n<hr />\n"}, {"titre": "1. Le calendrier officiel", "html": "<h2>1. Le calendrier officiel</h2>\n<p>Enfin confirmé, depuis le livret pédagogique.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Début des CM et des TD sans CM</td>\n<td><strong>7 septembre 2026</strong></td>\n</tr>\n<tr>\n<td>Début des TD accolés à des CM</td>\n<td><strong>21 septembre 2026</strong></td>\n</tr>\n<tr>\n<td>Pause pédagogique</td>\n<td><strong>26 octobre au 1er novembre 2026</strong></td>\n</tr>\n<tr>\n<td>Début des CM du semestre 2</td>\n<td>11 janvier 2027</td>\n</tr>\n<tr>\n<td>TD accolés, semestre 2</td>\n<td>25 janvier 2027</td>\n</tr>\n<tr>\n<td>Pauses du semestre 2</td>\n<td>22-27 février · 19 avril au 1er mai 2027</td>\n</tr>\n<tr>\n<td><strong>Jury du semestre 1</strong></td>\n<td><strong>mercredi 3 février 2027</strong></td>\n</tr>\n<tr>\n<td>Jury du semestre 2</td>\n<td>mercredi 2 juin 2027</td>\n</tr>\n<tr>\n<td>Jury de session 2</td>\n<td>mercredi 7 juillet 2027</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conséquence immédiate.</strong> Les TD accolés aux CM ont commencé le 21 septembre.\nSi ceux de microéconomie sont hebdomadaires, la séance 5 — celle du premier\ndevoir sur table — tombe autour du 19 au 24 octobre. C'est maintenant. Et la\npause pédagogique commence dans quelques jours.</p>\n<hr />\n"}, {"titre": "2. Les cours déjà cartographiés", "html": "<h2>2. Les cours déjà cartographiés</h2>\n<table>\n<thead>\n<tr>\n<th>Cours</th>\n<th>id</th>\n<th>Ce que Moodle contient</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Microéconomie</td>\n<td>5985</td>\n<td>Introduction générale, Consommateur (1) et (2), Producteur, Définitions 1 et 2, forum de questions CM/TD</td>\n</tr>\n<tr>\n<td>Calcul et analyse des coûts</td>\n<td>8660</td>\n<td>Plan de cours, thème 1, thème 2</td>\n</tr>\n<tr>\n<td>Techniques d'enquête</td>\n<td>14443</td>\n<td>Les six séances</td>\n</tr>\n<tr>\n<td>Histoire des sciences</td>\n<td>9002</td>\n<td><strong>Introduction et partie 1</strong>, <strong>Partie 2 — Raisonnement scientifique</strong>, et un <strong>Partiel archive</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Point à noter sur Histoire des sciences : Moodle ne publie pour 2026-2027 que\nl'introduction, la partie 1 et la partie 2. Les neuf parties en ma possession\ncouvrent donc plus que ce qui est actuellement en ligne — soit le cours est\npublié au fil des séances, soit le périmètre a changé. <strong>Le « Partiel archive »\nest un sujet d'examen des années précédentes : c'est la ressource la plus utile\ndu cours.</strong></p>\n<hr />\n"}, {"titre": "3. Les cours à cartographier", "html": "<h2>3. Les cours à cartographier</h2>\n<h3>Techniques financières — id 3399</h3>\n<p>Le plus riche en ressources exploitables.</p>\n<ul>\n<li>Polycopié : <em>Chapitre I — éléments de mathématiques financières</em></li>\n<li>Une section « corrections des exercices »</li>\n<li><strong>Cinq sujets d'examen terminal : janvier 2022, janvier 2023, décembre 2023,\n  décembre 2024, décembre 2025</strong></li>\n<li>Le rapport d'évaluation de l'enseignement par les étudiants 2025-26</li>\n</ul>\n<p>Cinq annales d'un même enseignant sur quatre ans, c'est le gisement le plus\nprécieux de tout ton semestre. Les types d'exercices se répètent d'une année à\nl'autre ; la structure de l'épreuve se déduit de la comparaison.</p>\n<h3>Monnaie et financement de l'économie — id 8382</h3>\n<p>Plan clair, cours en cours de publication :</p>\n<ul>\n<li>Présentation du CM et <strong>chapitre introductif</strong></li>\n<li><strong>Chapitre 1 — Les prémisses de la monnaie</strong></li>\n<li><strong>Chapitre 2 — Détention monétaire et théories économiques</strong></li>\n<li>Chapitre 3 — La création monétaire <em>(section créée, encore vide)</em></li>\n<li>Lien d'approfondissement : projections macroéconomiques de la Banque de\n  France, septembre 2026</li>\n</ul>\n<p>C'est la matière qui alimente la courbe LM côté macro, comme annoncé dans\n<code>PROGRESSION.md</code>.</p>\n<h3>Travail, emploi, chômage — id 10446</h3>\n<p>Trois sections créées — Généralités, « Documents de cours : mise à jour\nrégulière des PPT, vérifiez que vous avez la bonne version », Fiches de TD —\nmais <strong>aucun fichier n'est accessible pour l'instant</strong>. Soit rien n'est encore\ndéposé, soit tu n'es pas inscrit à la partie contenu. À vérifier auprès de\nl'enseignant si des diapos ont été annoncées en amphi.</p>\n<h3>Fonctions tableur Excel — id 12645</h3>\n<p>Un fichier unique, <em>Fonctions tableur excel</em>. Rattaché au bloc inférence\nstatistique plutôt qu'à une UE autonome.</p>\n<h3>Marketing &amp; Société — id 3855</h3>\n<p>Repéré dans ta liste, pas encore inspecté.</p>\n<hr />\n"}, {"titre": "4. L'inférence statistique", "html": "<h2>4. L'inférence statistique</h2>\n<p>Ton option n'est pas un cours unique : elle est <strong>éclatée en une quinzaine de\nmini-cours Moodle</strong>, un par ressource. C'est inhabituel et ça rend la matière\nillisible depuis le tableau de bord. Reconstituée dans l'ordre pédagogique :</p>\n<table>\n<thead>\n<tr>\n<th>Étape</th>\n<th>Ressources</th>\n<th>id</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Rappels</td>\n<td>Rappels stats descriptives · distinction stats descriptives / inférentielles</td>\n<td>12437, 12488, 12642, 12655</td>\n</tr>\n<tr>\n<td>Échantillonnage</td>\n<td>échantillonnage · sondage échantillonnage · initiation fonctions échantillonnage</td>\n<td>12489, 12654, 12646</td>\n</tr>\n<tr>\n<td>Simulation</td>\n<td>dé cubique · dé cubique excel · dé tétraédrique échantillonnage · échantillonnage simulation quizz</td>\n<td>12649, 12651, 12653, 12652</td>\n</tr>\n<tr>\n<td>Application</td>\n<td>surbooking</td>\n<td>12647</td>\n</tr>\n<tr>\n<td>Corrections de TD</td>\n<td>CORRECTION TD1 · correction td1 stats inférentielles · STATS INF CORRECTION TD1 VERSION EXCEL · CORRECTION TD1 PROBAS L2EG S3 (4 exercices corrigés)</td>\n<td>12446, 12438, 12447, 14924</td>\n</tr>\n<tr>\n<td>Outil</td>\n<td>Fonctions tableur excel</td>\n<td>12645</td>\n</tr>\n</tbody>\n</table>\n<p>Cet ordre correspond exactement à la chaîne quantitative de <code>PROGRESSION.md</code> :\ndescriptif, puis échantillonnage, puis estimation. Le passage par la simulation\n— dés, surbooking — est la façon dont l'enseignant fait toucher du doigt la\ndistribution d'échantillonnage avant de la formaliser.</p>\n<hr />\n"}, {"titre": "5. Ce qu'il faut télécharger", "html": "<h2>5. Ce qu'il faut télécharger</h2>\n<p>Je peux lire la structure de Moodle, mais pas extraire le contenu des PDF et\ndes PowerPoint à travers le navigateur sans y passer un temps déraisonnable.\nPour que je produise les cartes, dépose-moi ces fichiers :</p>\n<p><strong>Priorité 1 — les annales.</strong> Les cinq sujets de Techniques financières, et le\n« Partiel archive » d'Histoire des sciences. Ce sont les seuls documents qui\ndisent ce qui est réellement demandé en épreuve.</p>\n<p><strong>Priorité 2 — les cours neufs.</strong> Le chapitre I de Techniques financières ;\nle chapitre introductif et les chapitres 1 et 2 de Monnaie et financement.</p>\n<p><strong>Priorité 3 — l'inférence statistique.</strong> Les rappels, l'échantillonnage et la\ncorrection du TD1 à quatre exercices suffisent pour construire la carte ; les\nfichiers de simulation sont secondaires.</p>\n<p><strong>Et le livret pédagogique</strong>, 49 pages, qui contient le descriptif officiel de\nchaque enseignement et la maquette avec les ECTS. Il résout la question des UE\nrestée ouverte depuis le début.</p>"}]}];
const $ = s => document.querySelector(s);
let index = 0;

/* ═══ retour haptique ═══
   L'API Vibration n'existe que sur Android et quelques navigateurs de
   bureau : Safari, donc tout iPhone et tout Mac, ne l'implémente pas.
   Là où elle manque, on rend le retour par un très court repli sonore
   (WebAudio) plus la réponse visuelle du bouton, ce qui donne la même
   sensation de confirmation sans prétendre vibrer.                     */
const haptique = (() => {
  let ctx = null, autorise = false;
  const peutVibrer = typeof navigator !== "undefined" && !!navigator.vibrate;
  addEventListener("pointerdown", () => { autorise = true; }, { once: true });
  return (force = "leger") => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const motifs = { leger: 8, moyen: [0, 14], fort: [0, 10, 40, 18] };
    if (peutVibrer) { try { navigator.vibrate(motifs[force]); return; } catch (e) {} }
    if (!autorise) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = force === "fort" ? 112 : 168;
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(force === "leger" ? 0.035 : 0.06, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.06);
    } catch (e) {}
  };
})();

/* ═══ rendu ═══ */
function onglets() {
  $("#matieres").innerHTML = DOCS.map((d, i) =>
    `<button class="onglet" data-i="${i}" style="--ho:var(--h-${d.cle})"
       aria-current="${i === index}">${d.titre}</button>`).join("");
  document.querySelectorAll(".onglet").forEach(b =>
    b.onclick = () => aller(Number(b.dataset.i)));
}

function rendre(doc) {
  $("#m-titre").textContent = doc.titre;
  $("#m-sous").textContent = doc.sousTitre;
  const corps = $("#corps");
  corps.innerHTML =
    `<div class="page">
       <div class="entete"><h1>${doc.titre}</h1><p>${doc.sousTitre}</p></div>
       ${doc.sections.map((s, i) => `<section class="bloc" id="s${i}">${s.html}</section>`).join("")}
     </div>`;
  // les tableaux larges défilent dans leur propre conteneur
  corps.querySelectorAll("table").forEach(t => {
    const b = document.createElement("div"); b.className = "tableau";
    t.parentNode.insertBefore(b, t); b.appendChild(t);
  });
  $("#liste-sections").innerHTML = doc.sections.map((s, i) =>
    `<button data-s="${i}">${s.titre}</button>`).join("");
  document.querySelectorAll("#liste-sections button").forEach(b =>
    b.onclick = () => {
      haptique("leger"); fermer();
      $("#s" + b.dataset.s).scrollIntoView({ block: "start" });
    });
}

function aller(i, silencieux) {
  if (i < 0 || i >= DOCS.length || i === index) return;
  const doc = DOCS[i];
  if (!silencieux) haptique("moyen");

  const page = document.querySelector(".page");
  const suite = () => {
    index = i;
    document.body.style.setProperty("--h", `var(--h-${doc.cle})`);
    document.querySelectorAll(".onglet").forEach(b =>
      b.setAttribute("aria-current", Number(b.dataset.i) === i));
    rendre(doc);
    scrollTo({ top: 0, behavior: "instant" });
    $("#voile").classList.remove("actif");
    void $("#voile").offsetWidth;
    $("#voile").classList.add("actif");
    location.hash = doc.cle;
    document.querySelector(`.onglet[data-i="${i}"]`)
      ?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  };

  if (page && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    page.classList.add("sortie");
    setTimeout(suite, 150);
  } else suite();
}

/* ═══ navigation ═══ */
$("#b-prec").onclick = () => aller(index - 1);
$("#b-suiv").onclick = () => aller(index + 1);
$("#b-sections").onclick = () => { haptique("leger"); $("#panneau").classList.add("ouvert"); };
const fermer = () => $("#panneau").classList.remove("ouvert");
$("#panneau").onclick = e => { if (e.target.id === "panneau") fermer(); };

addEventListener("keydown", e => {
  if (e.key === "Escape") return fermer();
  if (e.target.closest("input,textarea")) return;
  if (e.key === "ArrowLeft") aller(index - 1);
  if (e.key === "ArrowRight") aller(index + 1);
});

/* balayage horizontal sur mobile */
let x0 = null, y0 = null;
addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.8) aller(index + (dx < 0 ? 1 : -1));
  x0 = y0 = null;
}, { passive: true });

/* progression de lecture */
addEventListener("scroll", () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $("#jauge").style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
}, { passive: true });

/* ═══ démarrage ═══ */
onglets();
const depart = DOCS.findIndex(d => d.cle === location.hash.slice(1));
index = -1;
aller(depart >= 0 ? depart : 0, true);
</script>
</body>
</html>
