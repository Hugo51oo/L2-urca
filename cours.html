<html lang="fr">
<head>

<title>Cours L2 — URCA</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L2">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* ═══════════════════════════════════════════════════════════════
   PALETTE — bloc unique à remplacer par celle de SafeSpot.
   Coller ici le :root de safespot/index.html suffit à reskinner
   toute l'application ; aucun autre endroit ne contient de couleur
   en dur.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fond:        #0E1626;
  --fond-2:      #16223A;
  --fond-3:      #1F2E4D;
  --ligne:       #28395C;
  --texte:       #E9E9E6;
  --texte-doux:  #94A0B6;
  --accent:      #C08A4E;
  --accent-vif:  #E0AB6D;

  /* une teinte par cours : le changement de couleur EST l'information
     qui dit qu'on a changé de matière */
  --h-maquette:  14;
  --h-plan:      46;
  --h-blanccc:   24;
  --h-blanc:     352;
  --h-monnaie:   128;
  --h-tefi:      88;
  --h-infstat:   305;
  --h-micro:     202;
  --h-couts:     38;
  --h-enquete:   162;
  --h-sciences:  280;
  --h-synthese:  12;
  --h-moodle:    190;

  --duree:       .34s;
  --courbe:      cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--fond);color:var(--texte);
  font-family:"Newsreader",Georgia,serif;
  font-size:17px;line-height:1.62;
  min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

/* teinte active, recalculée à chaque changement de page */
body{
  --h:var(--h-maquette);
  --teinte:      hsl(var(--h) 46% 62%);
  --teinte-doux: hsl(var(--h) 40% 22%);
  --teinte-voile:hsl(var(--h) 55% 60% / .09);
  transition:background var(--duree) var(--courbe);
}

/* ─────────── coiffe ─────────── */
header{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(hsl(var(--h) 30% 9% / .94),hsl(var(--h) 30% 9% / .72));
  border-bottom:1px solid var(--ligne);
  transition:background var(--duree) var(--courbe);
}
.coiffe{max-width:760px;margin:0 auto;padding:14px 20px 0}
.marque{display:flex;align-items:baseline;gap:10px}
.accueil{display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:30px;height:30px;margin:-4px -2px -4px -8px;align-self:center;
  color:var(--texte-doux);border-radius:9px;text-decoration:none;
  transition:background .18s,color .18s}
.accueil:hover,.accueil:focus-visible{background:var(--fond-3);color:var(--texte)}
.accueil svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.marque b{font-weight:600;font-size:19px;letter-spacing:-.01em}
.marque span{font-size:13px;color:var(--texte-doux)}
.jauge{height:2px;background:var(--ligne);margin-top:12px;border-radius:2px;overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:var(--teinte);
  transition:width .18s linear,background var(--duree) var(--courbe)}

/* ─────────── onglets de matière ─────────── */
nav.matieres{
  display:flex;gap:6px;overflow-x:auto;padding:12px 20px 13px;
  max-width:760px;margin:0 auto;scrollbar-width:none;
}
nav.matieres::-webkit-scrollbar{display:none}
.onglet{
  flex:0 0 auto;border:1px solid var(--ligne);background:transparent;
  color:var(--texte-doux);border-radius:999px;padding:7px 15px;
  font:inherit;font-size:13.5px;font-family:ui-sans-serif,system-ui,sans-serif;
  cursor:pointer;white-space:nowrap;
  transition:color .2s,border-color .2s,background .2s,transform .12s var(--courbe);
}
.onglet:hover{color:var(--texte)}
.onglet:active{transform:scale(.96)}
.onglet[aria-current=true]{
  color:hsl(var(--ho) 50% 72%);
  border-color:hsl(var(--ho) 45% 40%);
  background:hsl(var(--ho) 50% 55% / .12);
}
.onglet:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}

/* ─────────── corps ─────────── */
main{max-width:760px;margin:0 auto;padding:30px 20px 120px}
.entete{margin-bottom:26px}
.entete h1{
  font-size:clamp(28px,7vw,40px);font-weight:600;line-height:1.14;
  letter-spacing:-.02em;
}
.entete p{color:var(--texte-doux);font-size:15px;margin-top:5px}

/* le fondu : c'est le moment que l'application soigne */
.page{animation:entree var(--duree) var(--courbe) both}
.page.sortie{animation:sortie .17s var(--courbe) both}
@keyframes entree{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sortie{from{opacity:1}to{opacity:0;transform:translateY(-6px)}}

/* voile de teinte qui balaie l'écran au changement de matière */
#voile{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(120% 80% at 50% 0%,var(--teinte-voile),transparent 70%);
}
#voile.actif{animation:balayage .5s var(--courbe)}
@keyframes balayage{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

/* ─────────── contenu markdown ─────────── */
h2{
  font-size:23px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
  margin:44px 0 14px;padding-top:22px;border-top:1px solid var(--ligne);
}
.page > .bloc:first-child h2{border-top:0;padding-top:0;margin-top:8px}
h3{font-size:18.5px;font-weight:600;margin:28px 0 10px;color:hsl(var(--h) 38% 78%)}
p{margin:0 0 14px;max-width:68ch}
strong{font-weight:600;color:hsl(var(--h) 45% 84%)}
em{font-style:italic;color:var(--texte-doux)}
ul,ol{margin:0 0 16px 20px}
li{margin-bottom:7px;max-width:66ch}
li::marker{color:var(--teinte)}
hr{border:0;border-top:1px solid var(--ligne);margin:34px 0}
a{color:var(--teinte);text-underline-offset:3px}

code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--fond-3);padding:2px 6px;border-radius:4px;color:hsl(var(--h) 40% 80%);
}
pre{
  background:var(--fond-2);border:1px solid var(--ligne);border-left:2px solid var(--teinte);
  border-radius:5px;padding:15px 17px;overflow-x:auto;margin:0 0 18px;
  font-size:13.5px;line-height:1.55;
}
pre code{background:none;padding:0;color:var(--texte-doux);font-size:inherit}

.tableau{overflow-x:auto;margin:0 0 20px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:420px;
  font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--ligne);vertical-align:top}
th{color:var(--texte-doux);font-weight:600;font-size:12.5px;
  background:var(--fond-2);position:sticky;top:0}
tbody tr:hover{background:hsl(var(--h) 40% 50% / .05)}
blockquote{
  border-left:2px solid var(--teinte);padding:4px 0 4px 18px;margin:0 0 18px;
  color:var(--texte-doux);font-style:italic;
}

/* ─────────── sommaire flottant ─────────── */
.sommaire{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(transparent,hsl(var(--h) 30% 7% / .9) 26%);
  padding:26px 20px calc(16px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.sommaire .barre{
  max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;
  pointer-events:auto;
}
.bouton{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--fond-2);border:1px solid var(--ligne);color:var(--texte);
  border-radius:11px;padding:13px 14px;font:inherit;font-size:14.5px;
  font-family:ui-sans-serif,system-ui,sans-serif;cursor:pointer;
  transition:transform .12s var(--courbe),border-color .2s,background .2s;
}
.bouton:hover{border-color:hsl(var(--h) 40% 45%)}
.bouton:active{transform:scale(.97)}
.bouton:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.bouton.principal{background:hsl(var(--h) 45% 55% / .16);border-color:hsl(var(--h) 45% 45%)}
.bouton svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* panneau des sections */
#panneau{
  position:fixed;inset:0;z-index:70;display:none;
  background:hsl(var(--h) 34% 5% / .78);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#panneau.ouvert{display:block;animation:fondu .22s var(--courbe)}
@keyframes fondu{from{opacity:0}to{opacity:1}}
#panneau .liste{
  position:absolute;left:0;right:0;bottom:0;max-height:76dvh;overflow-y:auto;
  background:var(--fond-2);border-top:1px solid var(--ligne);
  border-radius:18px 18px 0 0;padding:10px 0 calc(18px + env(safe-area-inset-bottom));
  animation:monte .3s var(--courbe);
}
@keyframes monte{from{transform:translateY(26px)}to{transform:none}}
.poignee{width:36px;height:4px;background:var(--ligne);border-radius:3px;margin:6px auto 12px}
#panneau button{
  display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--texte);font:inherit;font-size:15.5px;padding:12px 24px;cursor:pointer;
  font-family:ui-sans-serif,system-ui,sans-serif;
  border-left:2px solid transparent;
}
#panneau button:hover{background:var(--fond-3)}
#panneau button[aria-current=true]{border-left-color:var(--teinte);color:hsl(var(--h) 45% 78%)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media (min-width:900px){
  body{font-size:17.5px}
  main{padding-top:38px}
}
</style>
</head>

</header>

    <button class="bouton" id="b-prec" aria-label="Matière précédente">

      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Sections

</div>

<div id="voile"></div>

</div>

<script>
const DOCS = [{"cle": "maquette", "titre": "Maquette S3", "sousTitre": "UE, codes et dates réelles", "sections": [{"titre": "Source officielle : le livret pédagogique L2 Économie (Reims) 2026-2027", "html": "<h2>Source officielle : le livret pédagogique L2 Économie (Reims) 2026-2027</h2>\n<p>Relevé le 2 novembre 2026 depuis le livret pédagogique déposé sur Moodle\n(cours 14043), croisé avec les emplois du temps <code>EDT CM L2 EG</code> et\n<code>EDT TD L2 EG</code> pour les dates de séances.</p>\n<p>C'est la pièce qui manquait depuis le début. Les deux reconstitutions\nprécédentes — <code>data/trame-l2-urca.json</code>, puis la version de cette carte tirée\ndes seuls emplois du temps — sont caduques : la première posait une matière par\nUE, la seconde ignorait les ECTS et les modalités d'évaluation.</p>\n<hr />\n"}, {"titre": "1. La maquette, telle qu'elle est", "html": "<h2>1. La maquette, telle qu'elle est</h2>\n<p>Trente crédits, cinq UE, neuf enseignements suivis. Les ECTS sont <strong>par EC</strong>,\npas par UE.</p>\n<table>\n<thead>\n<tr>\n<th>UE</th>\n<th>EC</th>\n<th>Enseignement</th>\n<th>ECTS</th>\n<th>CM</th>\n<th>TD</th>\n<th>1re session</th>\n<th>2e session</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>3.1</strong></td>\n<td>1</td>\n<td>Microéconomie : les formes de concurrence</td>\n<td><strong>6</strong></td>\n<td>24 h</td>\n<td>15 h</td>\n<td>1 CC (50 %) + ET 3 h (50 %)</td>\n<td>ET 3 h (100 %)</td>\n</tr>\n<tr>\n<td><strong>3.2</strong></td>\n<td>1</td>\n<td>Monnaie et financement de l'économie</td>\n<td><strong>6</strong></td>\n<td>30 h</td>\n<td>—</td>\n<td><strong>ET 1 h 30 (100 %)</strong></td>\n<td>ET 1 h 30 (100 %)</td>\n</tr>\n<tr>\n<td><strong>3.3</strong></td>\n<td>1</td>\n<td>Calcul et analyse des coûts</td>\n<td><strong>3</strong></td>\n<td>18 h</td>\n<td>10 h</td>\n<td>1 CC (50 %) + ET 1 h 30 (50 %)</td>\n<td>ET 1 h 30 (100 %)</td>\n</tr>\n<tr>\n<td></td>\n<td>2</td>\n<td>TEDS — transition écologique</td>\n<td><strong>3</strong></td>\n<td>—</td>\n<td>—</td>\n<td>ET 45 min (100 %)</td>\n<td>ET 45 min (100 %)</td>\n</tr>\n<tr>\n<td><strong>3.4</strong></td>\n<td>1</td>\n<td>Techniques financières</td>\n<td><strong>2</strong></td>\n<td>18 h</td>\n<td>—</td>\n<td><strong>ET 1 h 30 (100 %)</strong></td>\n<td>ET 1 h 30 (100 %)</td>\n</tr>\n<tr>\n<td></td>\n<td>2</td>\n<td>Techniques d'enquête</td>\n<td><strong>4</strong></td>\n<td>18 h</td>\n<td>20 h</td>\n<td>1 CC (50 %) + ET 1 h 30 (50 %)</td>\n<td>ET 1 h 30 (100 %)</td>\n</tr>\n<tr>\n<td><strong>3.5</strong></td>\n<td>1</td>\n<td>English for Professional Purposes 1</td>\n<td><strong>2</strong></td>\n<td>—</td>\n<td>20 h</td>\n<td>1 CC (50 %) + 1 CC (50 %)</td>\n<td>OT (100 %)</td>\n</tr>\n<tr>\n<td></td>\n<td>2A</td>\n<td>Introduction à l'inférence statistique <em>(ton option)</em></td>\n<td><strong>2</strong></td>\n<td>12 h</td>\n<td>22 h</td>\n<td>1 CC (50 %) + ET 1 h 30 (50 %)</td>\n<td>ET 1 h 30 (100 %)</td>\n</tr>\n<tr>\n<td></td>\n<td>3A</td>\n<td>Histoire des sciences et du raisonnement scientifique <em>(ton option)</em></td>\n<td><strong>2</strong></td>\n<td>20 h</td>\n<td>—</td>\n<td><strong>ET 1 h 30 (100 %)</strong></td>\n<td>ET 1 h 30 (100 %)</td>\n</tr>\n</tbody>\n</table>\n<p>Les options non retenues, pour mémoire : 2B voie quantitative probabilités\n(CCI 100 %), 3B voie quantitative algèbre matricielle (CCI 100 %), 3C\npréparation aux concours du 1er degré, 3D engagement étudiant, 3E activités\nphysiques et sportives.</p>\n<h3>Deux points à vérifier</h3>\n<p><strong>Marketing et société n'apparaît pas dans ce livret.</strong> Tu es inscrit au cours\nMoodle <code>L2 EG/LAS REIMS S3 MARKETING &amp; SOCIETE</code> et l'emploi du temps place ses\nTD en semaines 43, 46, 47, 48 et 49. Mais le livret L2 <strong>Économie</strong> met TEDS à\nla place, en UE 3.3 EC2. L'explication la plus probable : Marketing et société\nest l'EC 3.3.2 du livret L2 <strong>Gestion</strong>, et ton inscription Moodle est\nrésiduelle — ou bien c'est l'inverse et c'est TEDS qui est de trop. Trois ECTS\nen dépendent, donc la question se tranche avant décembre, auprès du secrétariat\nou de Véronique Chossat Noblot, responsable de mention.</p>\n<p><strong>« Travail, emploi, chômage » est bien un cours du second semestre.</strong> Le\nlivret le place en S4 (3 ECTS, 18 h CM, 10 h TD), et son espace Moodle ne\ncontient qu'un forum d'annonces vide. Rien à travailler cette année avant\njanvier.</p>\n<hr />\n"}, {"titre": "2. Le calendrier qui compte", "html": "<h2>2. Le calendrier qui compte</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pause pédagogique</td>\n<td>26 octobre → 1er novembre 2026 <em>(terminée)</em></td>\n</tr>\n<tr>\n<td><strong>Session d'examens du semestre 3</strong></td>\n<td><strong>7 au 19 décembre 2026</strong></td>\n</tr>\n<tr>\n<td>Jury de semestre 1</td>\n<td>mercredi 3 février 2027</td>\n</tr>\n<tr>\n<td>Reprise, second semestre</td>\n<td>11 janvier 2027</td>\n</tr>\n<tr>\n<td>Session 2</td>\n<td>14 au 25 juin 2027</td>\n</tr>\n<tr>\n<td>Jury de session 2</td>\n<td>mercredi 7 juillet 2027</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Cinq semaines et demie avant la première épreuve.</strong> Tout ce qui suit se lit\navec cette date en tête.</p>\n<hr />\n"}, {"titre": "3. Les cours magistraux", "html": "<h2>3. Les cours magistraux</h2>\n<table>\n<thead>\n<tr>\n<th>Enseignement</th>\n<th>CM</th>\n<th>Enseignant</th>\n<th>Créneau</th>\n<th>Première → dernière</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Microéconomie</td>\n<td>24 h</td>\n<td>Jean-Sébastien <strong>Gharbi</strong></td>\n<td>lundi 10 h-13 h</td>\n<td>7 sept → <strong>2 nov — dernière séance aujourd'hui</strong></td>\n</tr>\n<tr>\n<td>Monnaie et financement</td>\n<td>30 h</td>\n<td>Véronique <strong>Chossat</strong></td>\n<td>mardi 10 h-13 h</td>\n<td>15 sept → <strong>24 nov</strong></td>\n</tr>\n<tr>\n<td>Calcul et analyse des coûts</td>\n<td>18 h</td>\n<td>Bruno <strong>Huet</strong></td>\n<td>lundi 8 h-10 h, amphi 1</td>\n<td>7 sept → <strong>9 nov</strong></td>\n</tr>\n<tr>\n<td>Techniques financières</td>\n<td>18 h</td>\n<td>Antonin <strong>Gaignette</strong></td>\n<td>jeudi 8 h</td>\n<td>10 sept → <strong>3 déc</strong></td>\n</tr>\n<tr>\n<td>Techniques d'enquête</td>\n<td>18 h</td>\n<td>Anne <strong>Rover</strong></td>\n<td>jeudi 13 h-16 h, amphi 8</td>\n<td>10 sept → <strong>15 oct — terminé</strong></td>\n</tr>\n<tr>\n<td>Inférence statistique</td>\n<td>12 h</td>\n<td>Bachir <strong>Dadda</strong></td>\n<td>samedi 9 h-12 h, lundi 14 h-17 h</td>\n<td>7 sept → <strong>19 sept — terminé</strong></td>\n</tr>\n<tr>\n<td>Histoire des sciences</td>\n<td>20 h</td>\n<td>Audrey <strong>Laude-Depezay</strong></td>\n<td>jeudi</td>\n<td>24 sept → <strong>26 nov</strong></td>\n</tr>\n</tbody>\n</table>\n<hr />\n"}, {"titre": "4. Les travaux dirigés", "html": "<h2>4. Les travaux dirigés</h2>\n<p>Repères : s45 = 2-8 nov · s46 = 9-15 nov · s47 = 16-22 nov · s48 = 23-29 nov ·\ns49 = 30 nov-6 déc.</p>\n<table>\n<thead>\n<tr>\n<th>TD</th>\n<th>Volume</th>\n<th>Semaines</th>\n<th>Remarque</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Microéconomie</td>\n<td>15 h</td>\n<td>s39 → s49, sauf 44 et 46</td>\n<td>groupes 5 et 6 : également sans s43</td>\n</tr>\n<tr>\n<td>Calcul et analyse des coûts</td>\n<td>10 h</td>\n<td>s39 → s45 ou s46 selon le groupe</td>\n<td></td>\n</tr>\n<tr>\n<td>Marketing et société</td>\n<td>10 h</td>\n<td>s43, 46, 47, 48, 49</td>\n<td><em>sous réserve, voir § 1</em></td>\n</tr>\n<tr>\n<td>Techniques d'enquête</td>\n<td>20 h</td>\n<td><strong>s45 → s49</strong></td>\n<td><strong>commence cette semaine</strong></td>\n</tr>\n<tr>\n<td>Anglais</td>\n<td>20 h</td>\n<td>s39 → s49 ou s43 selon le groupe</td>\n<td></td>\n</tr>\n<tr>\n<td>Inférence statistique</td>\n<td>22 h</td>\n<td>s39 → s48, sauf 44</td>\n<td>le gros de la matière</td>\n</tr>\n</tbody>\n</table>\n<hr />\n"}, {"titre": "5. Les échéances fermes", "html": "<h2>5. Les échéances fermes</h2>\n<p><strong>Contrôle continu de Calcul et analyse des coûts — semaine 47.</strong> Groupes 1, 4\net 6 : <strong>lundi 16 novembre, 8 h-10 h</strong>. Groupes 2, 3 et 5 : vendredi 20\nnovembre, même horaire. Tu es groupe 6, donc le 16. Ce CC vaut <strong>50 % d'un EC\nà 3 ECTS</strong>.</p>\n<p><strong>Devoir sur table de microéconomie, séance de TD n° 5.</strong> Les groupes 5 et 6\nn'avaient pas TD en s43 : la cinquième séance tombe en <strong>s45, cette semaine</strong>.\nCe CC vaut <strong>50 % d'un EC à 6 ECTS</strong> — le contrôle continu le plus lourd du\nsemestre.</p>\n<p><strong>Session d'examens, 7 au 19 décembre.</strong> Six épreuves terminales à placer dès\nque le calendrier détaillé paraîtra.</p>\n<hr />\n"}, {"titre": "6. Ce que les ECTS changent dans l'ordre de travail", "html": "<h2>6. Ce que les ECTS changent dans l'ordre de travail</h2>\n<p>La hiérarchie que j'avais posée avant le livret était fausse sur deux points.</p>\n<p><strong>Monnaie et financement est le plus gros enjeu du semestre, et de loin.</strong> Six\nECTS — à égalité avec la micro — mais <strong>100 % sur un seul écrit d'1 h 30</strong>. Pas\nde contrôle continu, aucun filet. Trente heures de cours magistral se jouent en\nquatre-vingt-dix minutes en décembre. C'est la matière où un semestre de\nprésence passive coûte le plus cher, et elle n'apparaissait nulle part dans le\nplan de travail précédent.</p>\n<p><strong>Techniques financières offre le meilleur rendement du semestre.</strong> Deux ECTS,\n100 % sur un écrit d'1 h 30, dix-huit heures de cours — et <strong>cinq annales\ncorrigées</strong> déposées sur Moodle, de janvier 2022 à décembre 2025, plus un\ndocument « Evaluation 2025-26 » qui donne les modalités. Un examen à format\nstable, entièrement prévisible, avec cinq sujets résolus en main. Trois\naprès-midi suffisent à sécuriser la note ; c'est le plus petit coût d'accès à\ndes points du semestre.</p>\n<p><strong>Histoire des sciences aussi est 100 % terminal</strong>, pour 2 ECTS, et son partiel\nde décembre 2024 est disponible.</p>\n<p><strong>La micro reste lourde mais la moitié est déjà jouée</strong> au moment du devoir de\nTD 5. Elle garde la priorité court terme à cause de la date, pas du poids.</p>\n<p>En ECTS évalués sur un écrit terminal unique, sans contrôle continu pour\namortir : <strong>Monnaie 6, Techniques financières 2, Histoire des sciences 2, TEDS\n3.</strong> Treize crédits sur trente se décident entièrement en décembre.</p>\n<hr />\n"}, {"titre": "7. Ce qui reste à confirmer", "html": "<h2>7. Ce qui reste à confirmer</h2>\n<ul>\n<li>Marketing et société contre TEDS en UE 3.3 EC2 — trois ECTS en jeu.</li>\n<li>Le calendrier détaillé de la session du 7 au 19 décembre.</li>\n<li>Les coefficients internes aux UE, si le jury en applique d'autres que les\n  ECTS. Le livret n'en mentionne pas : à défaut, le cockpit pondère par ECTS.</li>\n<li>La règle de compensation exacte, absente de ce livret.</li>\n</ul>"}]}, {"cle": "plan", "titre": "Plan de travail", "sousTitre": "S3 — l'ordre d'attaque", "sections": [{"titre": "Ouverture", "html": "<p>Les cinq séquences de travail, fondues en un seul ordre. Chaque carte garde la\nsienne pour le détail ; ce document dit <strong>dans quel ordre attaquer</strong>, et\npourquoi.</p>\n<p>Le principe d'ordonnancement est double : l'échéance la plus proche d'abord, et\nà échéance égale, ce dont le reste dépend.</p>\n<hr />\n"}, {"titre": "Ce qui commande le calendrier", "html": "<h2>Ce qui commande le calendrier</h2>\n<p><strong>La session d'examens court du 7 au 19 décembre 2026.</strong> Tout ce qui suit se\ncompte à partir de là.</p>\n<table>\n<thead>\n<tr>\n<th>EC</th>\n<th>ECTS</th>\n<th>Première échéance ferme</th>\n<th>Part jouée en décembre</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>3.2 Monnaie et financement</strong></td>\n<td><strong>6</strong></td>\n<td>écrit terminal, décembre</td>\n<td><strong>100 %</strong></td>\n</tr>\n<tr>\n<td>3.1 Microéconomie</td>\n<td>6</td>\n<td><strong>devoir sur table, TD n° 5, cette semaine</strong></td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>3.4.2 Techniques d'enquête</td>\n<td>4</td>\n<td>fiches, puis oral</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>3.3.1 Calcul et analyse des coûts</td>\n<td>3</td>\n<td><strong>CC lundi 16 novembre, 8 h</strong></td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>3.3.2 TEDS</td>\n<td>3</td>\n<td>écrit 45 min, décembre</td>\n<td>100 %</td>\n</tr>\n<tr>\n<td>3.4.1 Techniques financières</td>\n<td>2</td>\n<td>écrit terminal, décembre</td>\n<td><strong>100 %</strong></td>\n</tr>\n<tr>\n<td>3.5.2A Inférence statistique</td>\n<td>2</td>\n<td>contrôle continu en TD</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>3.5.3A Histoire des sciences</td>\n<td>2</td>\n<td>écrit terminal, décembre</td>\n<td>100 %</td>\n</tr>\n<tr>\n<td>3.5.1 Anglais</td>\n<td>2</td>\n<td>deux contrôles continus</td>\n<td>0 %</td>\n</tr>\n</tbody>\n</table>\n<p>Trois conséquences, dont deux nouvelles depuis la lecture du livret.</p>\n<p><strong>Monnaie et financement passe en tête du semestre.</strong> Six ECTS, autant que la\nmicro, mais intégralement joués sur un écrit d'1 h 30 en décembre : aucun\ncontrôle continu, aucun filet. Trente heures de cours magistral à restituer en\nquatre-vingt-dix minutes. C'est le plus gros enjeu du semestre et il\nn'apparaissait nulle part dans les versions précédentes de ce plan.</p>\n<p><strong>Techniques financières est le meilleur rendement du semestre.</strong> Deux ECTS,\n100 % terminal, dix-huit heures de cours — et <strong>cinq annales corrigées</strong>\ncouvrant 2022 à 2025, format manifestement stable. Trois après-midi de travail\nsur annales suffisent à sécuriser la note. Aucune autre matière n'offre ce\nrapport.</p>\n<p><strong>La micro garde la priorité court terme, pour sa date et non son poids.</strong> Son\ndevoir de TD n° 5 tombe cette semaine, et il vaut la moitié d'un EC à 6 ECTS.\nMais une fois passé, la moitié de la matière est jouée, et l'attention doit\nbasculer sur Monnaie.</p>\n<p>Et l'oral de Techniques d'enquête se lance toujours bien avant sa date, parce\nque c'est le seul livrable du semestre qui se construit au lieu de se réviser.</p>\n<hr />\n"}, {"titre": "Phase 1 — la fondation (les deux premières semaines)", "html": "<h2>Phase 1 — la fondation (les deux premières semaines)</h2>\n<p>Rien ici ne dépend d'un document manquant.</p>\n<ol>\n<li><strong>Le socle quantitatif</strong> — optimisation sous contrainte et Lagrange, calcul\n   matriciel, lois de probabilité, estimation. Deux heures par jour, en\n   exercices. Les deux optimums de micro <em>sont</em> des lagrangiens : ce socle\n   n'est pas une matière à part, c'est l'outil du chapitre 1.</li>\n<li><strong>Micro, la colonne consommateur</strong> — tracer, dériver un TmS, poser\n   l'optimum sans notes.</li>\n<li><strong>Micro, l'introduction générale</strong>, fichée sérieusement. Huit points par\n   épreuve, trois épreuves, et presque personne ne la travaille en la prenant\n   pour un préambule. Meilleur rapport temps/points du semestre.</li>\n<li><strong>Coûts, le vocabulaire du thème 1</strong> — les quatre catégories de charges et\n   les deux axes de classification. Une demi-heure, pas plus.</li>\n<li><strong>Histoire des sciences, partie 1</strong> — les quatre raisonnements, jusqu'à\n   restitution à froid. Le titre de l'UE l'annonce : c'est le cœur.</li>\n</ol>\n<hr />\n"}, {"titre": "Phase 2 — les mécanismes (jusqu'au devoir de TD 5)", "html": "<h2>Phase 2 — les mécanismes (jusqu'au devoir de TD 5)</h2>\n<ol>\n<li><strong>Micro, la traduction vers le producteur</strong> — en une séance, en\n   reconstruisant de mémoire le tableau de correspondance consommateur /\n   producteur. Deux chapitres révisés séparément, c'est deux fois le même\n   travail.</li>\n<li><strong>Coûts, le cas de la PMI refait intégralement sans le poly</strong>, seconde\n   hypothèse d'imputation comprise. Si tu retombes sur 15 000 des deux côtés,\n   la thèse du cours est acquise.</li>\n<li><strong>Enquête, le clivage Weber / Durkheim</strong>, jusqu'à pouvoir le poser <em>et</em> le\n   dépasser à froid. C'est la matrice de toute l'UE.</li>\n<li><strong>Enquête, la réflexivité</strong> — définition exacte, les deux niveaux, les trois\n   usages de Beaud et Weber. Elle traverse les six séances, donc elle tombera.</li>\n<li><strong>Micro, les exercices de TD refaits sans corrigé, dans les 24 heures.</strong>\n    Douze points sur vingt.</li>\n</ol>\n<hr />\n"}, {"titre": "Phase 3 — la technique (cœur du semestre)", "html": "<h2>Phase 3 — la technique (cœur du semestre)</h2>\n<ol>\n<li><strong>Coûts, la chaîne de calcul du thème 2 avec stocks</strong>, jusqu'à\n    l'automatisme. Faire buter au moins trois fois sur le passage produits\n    fabriqués / produits vendus.</li>\n<li><strong>Coûts, le tableau de répartition avec prestations réciproques</strong> — le\n    morceau technique du semestre.</li>\n<li><strong>Enquête, la chaîne d'opérationnalisation en quatre étapes</strong>, appliquée à\n    un concept de ton choix pour vérifier que tu sais la dérouler seul.</li>\n<li><strong>Histoire des sciences, parties 8 et 9</strong> — Kuhn, démarcation, éthique. À\n    froid également.</li>\n<li><strong>Histoire des sciences, parties 2 à 7 en une passe rapide</strong>, en\n    remplissant la grille d'exemples au fur et à mesure plutôt qu'en fichant\n    tout. Partie 4 en priorité, pour Bacon contre Descartes.</li>\n</ol>\n<hr />\n"}, {"titre": "Phase 4 — la restitution (avant les épreuves)", "html": "<h2>Phase 4 — la restitution (avant les épreuves)</h2>\n<ol>\n<li><strong>Les cartes de rappel actif</strong>, déjà écrites : 51 cartes réparties sur les\n    quatre UE. Le SM-2 les étale seul. Elles portent sur les mécanismes et les\n    pièges, jamais sur du calcul — le calcul s'acquiert en refaisant des\n    exercices.</li>\n<li><strong>Une question de réflexion par thème, à l'écrit, en dix minutes.</strong> « Le\n    coût de revient d'un produit est-il une donnée objective ? » est la\n    question centrale de Calcul des coûts et peut tomber sous dix\n    formulations. Même exercice en Histoire des sciences, dont le partiel est\n    bâti là-dessus.</li>\n<li><strong>La synthèse transversale</strong>, en toute fin : reconstituer de mémoire le\n    lien Durkheim / démarcation et le lien réflexivité / intégrité. Ça densifie\n    deux copies, ça ne remplace aucune des deux cartes.</li>\n</ol>\n<hr />\n"}, {"titre": "En parallèle, sans attendre", "html": "<h2>En parallèle, sans attendre</h2>\n<p><strong>L'oral de Techniques d'enquête.</strong> Dès que le sujet est connu : problématique\nau modèle « alors qu'il est coutume de voir cela, comment se fait-il que\nj'observe autre chose ? », puis opérationnalisation en quatre étapes. À poser\ndans le cockpit avec une <strong>échéance intermédiaire</strong>, sinon il se fera la veille.</p>\n<p><strong>L'inférence statistique (option).</strong> Aucun support reçu, donc aucune carte\nd'apprentissage. Mais la chaîne quantitative de <code>PROGRESSION.md</code> s'applique\ntelle quelle et l'ordre y est strict : probabilités, puis distributions\nd'échantillonnage, puis estimation ponctuelle, puis estimation par intervalle,\npuis tests d'hypothèses. Un trou à une étape rend la suivante inapprenable,\npas seulement difficile. Le socle de la phase 1 est déjà le début de cette\nchaîne.</p>\n<hr />\n"}, {"titre": "Ce qui reste bloqué", "html": "<h2>Ce qui reste bloqué</h2>\n<ul>\n<li>La maquette : quelles matières dans quelles UE, et les ECTS. Tant qu'elle\n  manque, aucun coefficient n'entre dans le cockpit — un barème inverse calculé\n  sur un mauvais regroupement donne de mauvaises priorités.</li>\n<li>Les dates d'épreuves, à commencer par les séances de TD 5 et 10 en micro.</li>\n<li>Le règlement d'examens, pour la règle de session 2.</li>\n</ul>"}]}, {"cle": "blanccc", "titre": "Devoir blanc — coûts", "sousTitre": "CC du lundi 16 novembre", "sections": [{"titre": "Pour le contrôle continu du lundi 16 novembre, 8 h-10 h", "html": "<h2>Pour le contrôle continu du lundi 16 novembre, 8 h-10 h</h2>\n<hr />\n"}, {"titre": "Le périmètre", "html": "<h2>Le périmètre</h2>\n<p>Le CC tombe une semaine après le dernier cours magistral du 9 novembre. Les\nneuf séances de deux heures auront donc toutes eu lieu, et le plan de Bruno\nHuet couvre :</p>\n<table>\n<thead>\n<tr>\n<th>Thème</th>\n<th>Contenu</th>\n<th>Au programme</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Introduction générale — typologies de coûts, classification des charges</td>\n<td>oui</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Méthode des coûts complets — fiches 1 à 5</td>\n<td>oui, c'est le cœur</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Direct costing simple et évolué</td>\n<td>oui</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Autres méthodes — imputation rationnelle, coût marginal, ABC</td>\n<td>notions</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Gestion des coûts sous contraintes</td>\n<td>« éventuellement » — peu probable</td>\n</tr>\n</tbody>\n</table>\n<p>Le CC vaut <strong>50 % d'un EC à 3 ECTS</strong>, l'écrit terminal de décembre l'autre\nmoitié. Groupes 1, 4 et 6 : lundi 16 novembre, 8 h-10 h. Deux heures, donc un\ncas complet plus des questions.</p>\n<p>Ce qui suit est un blanc construit sur ce périmètre. Corrigé en seconde partie.</p>\n<hr />\n"}, {"titre": "SUJET", "html": "<h2>SUJET</h2>\n<p><strong>Durée : 2 heures. Calculatrice autorisée. Aucun document.</strong></p>\n<h3>Partie 1 — Questions de cours (6 points)</h3>\n<p><strong>1. (2 points)</strong> Citez les quatre catégories de charges distinguées par la\ncomptabilité de gestion et les deux axes selon lesquels on classe les charges.\nQu'est-ce qui distingue une charge directe d'une charge indirecte ?</p>\n<p><strong>2. (2 points)</strong> Expliquez pourquoi le coût de production des produits\n<em>vendus</em> diffère du coût de production des produits <em>fabriqués</em>. Dans quel cas\nles deux coïncident-ils ?</p>\n<p><strong>3. (2 points)</strong> <em>Le coût de revient d'un produit est-il une donnée\nobjective ?</em> Répondez en une vingtaine de lignes, en vous appuyant sur au moins\ndeux exemples tirés du cours.</p>\n<h3>Partie 2 — Exercices (14 points)</h3>\n<h4>Exercice 1 — Coûts complets (8 points)</h4>\n<p>La société <strong>ARDENNE PLASTIQUE</strong> fabrique un produit unique P à partir d'une\nmatière M. Voici les données du mois de novembre.</p>\n<p><strong>Charges indirectes, répartition primaire :</strong></p>\n<table>\n<thead>\n<tr>\n<th>Centre</th>\n<th>Montant</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Gestion du personnel <em>(auxiliaire)</em></td>\n<td>60 000</td>\n</tr>\n<tr>\n<td>Entretien <em>(auxiliaire)</em></td>\n<td>30 000</td>\n</tr>\n<tr>\n<td>Approvisionnement</td>\n<td>21 750</td>\n</tr>\n<tr>\n<td>Atelier</td>\n<td>87 750</td>\n</tr>\n<tr>\n<td>Distribution</td>\n<td>26 500</td>\n</tr>\n<tr>\n<td><strong>Total</strong></td>\n<td><strong>226 000</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Répartition secondaire :</strong></p>\n<ul>\n<li>Gestion du personnel : 40 % Entretien, 15 % Approvisionnement, 35 % Atelier,\n  10 % Distribution.</li>\n<li>Entretien : 25 % Gestion du personnel, 5 % Approvisionnement, 60 % Atelier,\n  10 % Distribution.</li>\n</ul>\n<p><strong>Unités d'œuvre :</strong> Approvisionnement, le kilogramme de matière achetée ;\nAtelier, l'heure de main-d'œuvre directe ; Distribution, l'unité vendue.</p>\n<p><strong>Matière M :</strong> stock initial 3 000 kg pour 33 000 € ; achats du mois\n12 000 kg à 14 € le kilogramme ; consommation 10 000 kg. Sorties valorisées au\ncoût unitaire moyen pondéré de fin de période.</p>\n<p><strong>Production :</strong> 2 200 unités fabriquées, 3 000 heures de main-d'œuvre directe\nà 22 € l'heure.</p>\n<p><strong>Produits finis :</strong> stock initial 300 unités pour 48 000 € ; ventes\n2 000 unités à 210 € l'unité. Sorties valorisées au CUMP de fin de période.</p>\n<ol>\n<li>Achevez le tableau de répartition des charges indirectes et calculez le coût\n   de chaque unité d'œuvre. <em>(3 points)</em></li>\n<li>Calculez le coût d'achat de la matière M et présentez son compte de stock.\n   <em>(1,5 point)</em></li>\n<li>Calculez le coût de production des produits fabriqués, puis celui des\n   produits vendus. <em>(1,5 point)</em></li>\n<li>Calculez le coût de revient et le résultat analytique, en global et à\n   l'unité. <em>(1,5 point)</em></li>\n<li>Vérifiez l'égalité <code>SI + entrées − SF = sorties</code> sur les deux comptes de\n   stock. <em>(0,5 point)</em></li>\n</ol>\n<h4>Exercice 2 — Direct costing (3 points)</h4>\n<p>Sur l'exercice écoulé, ARDENNE PLASTIQUE a réalisé un chiffre d'affaires de\n5 040 000 €, pour 3 024 000 € de charges variables et 1 512 000 € de charges\nfixes.</p>\n<ol>\n<li>Calculez la marge sur coût variable, le taux de marge sur coût variable et\n   le résultat.</li>\n<li>Déterminez le seuil de rentabilité, la marge de sécurité et l'indice de\n   sécurité.</li>\n<li>En supposant l'activité régulière sur douze mois de trente jours, déterminez\n   le point mort.</li>\n</ol>\n<h4>Exercice 3 — Imputation rationnelle (3 points)</h4>\n<p>L'atelier supporte 150 000 € de charges fixes par mois et 40 € de charges\nvariables par unité produite. Son activité normale est de 3 000 unités. En\nnovembre, il n'en a produit que 2 400.</p>\n<ol>\n<li>Calculez le coefficient d'imputation rationnelle et le montant des charges\n   fixes imputées.</li>\n<li>Déterminez le coût de sous-activité.</li>\n<li>Calculez le coût unitaire de novembre avec imputation rationnelle, puis sans\n   imputation rationnelle, puis le coût unitaire qu'on obtiendrait à activité\n   normale. Que montre la comparaison des trois ?</li>\n</ol>\n<hr />\n"}, {"titre": "CORRIGÉ", "html": "<h2>CORRIGÉ</h2>\n<h3>Partie 1</h3>\n<p><strong>1. Les catégories et les axes.</strong>\nQuatre catégories : charges <strong>incorporables</strong> (reprises telles quelles),\ncharges <strong>non incorporables</strong> (comptabilisées mais écartées du calcul des\ncoûts : charges exceptionnelles, dotations hors exploitation), charges\n<strong>supplétives</strong> (non comptabilisées mais intégrées : rémunération du travail de\nl'exploitant, rémunération des capitaux propres) et charges <strong>de substitution</strong>\n(un montant comptable remplacé par un montant économiquement plus pertinent).</p>\n<p>Deux axes de classification : <strong>direct / indirect</strong>, et <strong>variable / fixe</strong>.\nIls sont indépendants : une charge peut être directe et fixe, indirecte et\nvariable.</p>\n<p>Une charge est <strong>directe</strong> quand elle est affectable à un coût sans calcul\nintermédiaire — la matière consommée par le produit, la main-d'œuvre qui y\ntravaille. Elle est <strong>indirecte</strong> quand elle concerne plusieurs coûts et\nnécessite une répartition conventionnelle par centres d'analyse et unités\nd'œuvre. Le mot <em>conventionnelle</em> est le point important : c'est là que la\nméthode entre dans le chiffre.</p>\n<p><strong>2. Fabriqués contre vendus.</strong>\nLe coût de production des produits fabriqués porte sur ce qui est <strong>sorti de\nl'atelier pendant la période</strong>. Le coût de production des produits vendus porte\nsur ce qui est <strong>sorti du stock pour être livré</strong>. Entre les deux s'intercale\nle compte de stock de produits finis, dont l'équation est</p>\n<p>$$\\text{SI} + \\text{entrées} - \\text{SF} = \\text{sorties}$$</p>\n<p>Dès qu'il existe un stock initial ou final de produits finis, les deux montants\ndiffèrent : une partie de ce qui est vendu a été fabriquée le mois précédent, à\nun autre coût, et une partie de ce qui est fabriqué reste en stock. Ils\ncoïncident dans le seul cas où <strong>stock initial et stock final de produits finis\nsont tous deux nuls</strong>, c'est-à-dire quand on vend exactement ce qu'on fabrique\nsans rien stocker.</p>\n<p><strong>3. Le coût de revient est-il objectif ?</strong>\nAttendu : la réponse est non, et la copie doit le démontrer, pas l'affirmer.</p>\n<p>Le coût de revient n'est pas une grandeur mesurée mais une grandeur\n<strong>construite</strong>. Trois choix de méthode, tous défendables, produisent trois\nchiffres différents à partir des mêmes faits.</p>\n<p><em>Le choix des unités d'œuvre.</em> Imputer les charges d'un atelier à l'heure de\nmain-d'œuvre ou à l'heure machine change la part attribuée à chaque produit. Un\nproduit à forte intensité capitalistique paraîtra bon marché avec la première\nclé et cher avec la seconde, sans qu'aucune donnée physique n'ait bougé.</p>\n<p><em>Le choix de la méthode de valorisation des stocks.</em> CUMP et FIFO divergent dès\nque les prix bougent dans la période. En période de hausse, FIFO valorise les\nsorties aux prix anciens, donc bas, et gonfle le résultat ; le CUMP lisse. Le\ncas Technor du cours est l'illustration directe : une hausse de 20 % du prix de\nla matière, soit 60 000 €, ne fait baisser le résultat que de 12 832 €, parce\nque la hausse se répartit entre ce qui est consommé et ce qui reste immobilisé\nen stock. <strong>L'effet n'est pas annulé, il est différé</strong> : les semi-finis de juin\ndeviennent les stocks initiaux de juillet.</p>\n<p><em>Le traitement des prestations réciproques.</em> Le total général réparti ne change\npas — dans le cas MARCO SA il reste 413 000 € — mais sa ventilation entre les\ncentres principaux, et donc entre les produits, dépend entièrement du système\nd'équations qu'on a accepté de poser.</p>\n<p>La conclusion à tirer : le coût de revient est un <strong>instrument de décision</strong>,\npas une mesure. Sa valeur ne tient pas à une exactitude qu'il ne peut pas\natteindre, mais à la cohérence de la méthode retenue et à sa stabilité dans le\ntemps, qui rendent les comparaisons entre périodes et entre produits\ninterprétables. Changer de méthode en cours de route, c'est perdre cela.</p>\n<p>Ouverture possible : c'est précisément pour échapper à l'arbitraire des clés de\nrépartition que la méthode ABC propose d'imputer par inducteurs d'activité — et\nelle déplace le problème sans le supprimer, puisqu'il faut alors choisir les\ninducteurs.</p>\n<h3>Exercice 1</h3>\n<p><strong>Question 1 — tableau de répartition.</strong></p>\n<p>Prestations réciproques. Soit $G$ le total de Gestion du personnel et $E$ celui\nd'Entretien :</p>\n<p>$$G = 60\\,000 + 0{,}25\\,E \\qquad E = 30\\,000 + 0{,}40\\,G$$</p>\n<p>Substitution : $G = 60\\,000 + 0{,}25\\,(30\\,000 + 0{,}40G) = 67\\,500 + 0{,}10G$,\ndonc $0{,}90\\,G = 67\\,500$ et</p>\n<p>$$\\boxed{G = 75\\,000} \\qquad E = 30\\,000 + 0{,}40 \\times 75\\,000 = \\boxed{60\\,000}$$</p>\n<p>Vérification : $60\\,000 + 0{,}25 \\times 60\\,000 = 75\\,000$ ✓</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Gestion</th>\n<th>Entretien</th>\n<th>Appro</th>\n<th>Atelier</th>\n<th>Distribution</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Répartition primaire</td>\n<td>60 000</td>\n<td>30 000</td>\n<td>21 750</td>\n<td>87 750</td>\n<td>26 500</td>\n</tr>\n<tr>\n<td>Gestion (75 000)</td>\n<td>−75 000</td>\n<td>+30 000</td>\n<td>+11 250</td>\n<td>+26 250</td>\n<td>+7 500</td>\n</tr>\n<tr>\n<td>Entretien (60 000)</td>\n<td>+15 000</td>\n<td>−60 000</td>\n<td>+3 000</td>\n<td>+36 000</td>\n<td>+6 000</td>\n</tr>\n<tr>\n<td><strong>Total secondaire</strong></td>\n<td><strong>0</strong></td>\n<td><strong>0</strong></td>\n<td><strong>36 000</strong></td>\n<td><strong>150 000</strong></td>\n<td><strong>40 000</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Contrôle : $36\\,000 + 150\\,000 + 40\\,000 = 226\\,000$, égal au total primaire ✓</p>\n<p>Coûts d'unité d'œuvre :</p>\n<ul>\n<li>Approvisionnement : $36\\,000 \\div 12\\,000 \\text{ kg} = \\mathbf{3\\ \\text{€/kg}}$</li>\n<li>Atelier : $150\\,000 \\div 3\\,000 \\text{ h} = \\mathbf{50\\ \\text{€/h}}$</li>\n<li>Distribution : $40\\,000 \\div 2\\,000 \\text{ u} = \\mathbf{20\\ \\text{€/u}}$</li>\n</ul>\n<p><strong>Question 2 — coût d'achat et stock de matière.</strong></p>\n<p>$$\\text{Coût d'achat} = \\underbrace{12\\,000 \\times 14}<em 36_000=\"36\\,000\">{168\\,000} + \\underbrace{12\\,000 \\times 3}</em>$$} = 204\\,000\\ \\text{€ pour }12\\,000\\text{ kg} = 17\\ \\text{€/kg</p>\n<p>Le piège est là : l'entrée en stock se valorise au <strong>coût d'achat</strong>, pas au prix\npayé. Les frais d'approvisionnement en font partie.</p>\n<table>\n<thead>\n<tr>\n<th>Matière M</th>\n<th>Quantité</th>\n<th>PU</th>\n<th>Montant</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Stock initial</td>\n<td>3 000</td>\n<td>11,00</td>\n<td>33 000</td>\n</tr>\n<tr>\n<td>Entrées</td>\n<td>12 000</td>\n<td>17,00</td>\n<td>204 000</td>\n</tr>\n<tr>\n<td><strong>Disponible</strong></td>\n<td><strong>15 000</strong></td>\n<td><strong>15,80</strong></td>\n<td><strong>237 000</strong></td>\n</tr>\n<tr>\n<td>Sorties</td>\n<td>10 000</td>\n<td>15,80</td>\n<td>158 000</td>\n</tr>\n<tr>\n<td>Stock final</td>\n<td>5 000</td>\n<td>15,80</td>\n<td>79 000</td>\n</tr>\n</tbody>\n</table>\n<p>$$\\text{CUMP} = \\frac{33\\,000 + 204\\,000}{3\\,000 + 12\\,000} = \\frac{237\\,000}{15\\,000} = \\mathbf{15{,}80\\ \\text{€/kg}}$$</p>\n<p><strong>Question 3 — coûts de production.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Coût de production des produits fabriqués</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière consommée (10 000 kg × 15,80)</td>\n<td>158 000</td>\n</tr>\n<tr>\n<td>Main-d'œuvre directe (3 000 h × 22)</td>\n<td>66 000</td>\n</tr>\n<tr>\n<td>Charges indirectes d'atelier (3 000 h × 50)</td>\n<td>150 000</td>\n</tr>\n<tr>\n<td><strong>Total pour 2 200 unités</strong></td>\n<td><strong>374 000</strong> → <strong>170 €/u</strong></td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th>Produits finis</th>\n<th>Quantité</th>\n<th>PU</th>\n<th>Montant</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Stock initial</td>\n<td>300</td>\n<td>160,00</td>\n<td>48 000</td>\n</tr>\n<tr>\n<td>Entrées</td>\n<td>2 200</td>\n<td>170,00</td>\n<td>374 000</td>\n</tr>\n<tr>\n<td><strong>Disponible</strong></td>\n<td><strong>2 500</strong></td>\n<td><strong>168,80</strong></td>\n<td><strong>422 000</strong></td>\n</tr>\n<tr>\n<td>Sorties (ventes)</td>\n<td>2 000</td>\n<td>168,80</td>\n<td>337 600</td>\n</tr>\n<tr>\n<td>Stock final</td>\n<td>500</td>\n<td>168,80</td>\n<td>84 400</td>\n</tr>\n</tbody>\n</table>\n<p>$$\\text{CUMP} = \\frac{422\\,000}{2\\,500} = \\mathbf{168{,}80\\ \\text{€/u}}$$</p>\n<p>Coût de production des produits <strong>vendus</strong> : $\\mathbf{337\\,600\\ \\text{€}}$ — et\nnon 374 000 €. L'écart de 36 400 € est l'effet du stockage : 500 unités de plus\nen stock à la fin qu'au début, à 168,80 € hors effet de moyenne.</p>\n<p><strong>Question 4 — coût de revient et résultat.</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Global</th>\n<th>À l'unité</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Coût de production des produits vendus</td>\n<td>337 600</td>\n<td>168,80</td>\n</tr>\n<tr>\n<td>Charges de distribution (2 000 × 20)</td>\n<td>40 000</td>\n<td>20,00</td>\n</tr>\n<tr>\n<td><strong>Coût de revient</strong></td>\n<td><strong>377 600</strong></td>\n<td><strong>188,80</strong></td>\n</tr>\n<tr>\n<td>Chiffre d'affaires (2 000 × 210)</td>\n<td>420 000</td>\n<td>210,00</td>\n</tr>\n<tr>\n<td><strong>Résultat analytique</strong></td>\n<td><strong>42 400</strong></td>\n<td><strong>21,20</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Question 5 — contrôles.</strong></p>\n<p>Matière : $33\\,000 + 204\\,000 - 79\\,000 = 158\\,000$ ✓\nProduits finis : $48\\,000 + 374\\,000 - 84\\,400 = 337\\,600$ ✓</p>\n<h3>Exercice 2</h3>\n<p><strong>1.</strong> $\\text{MCV} = 5\\,040\\,000 - 3\\,024\\,000 = \\mathbf{2\\,016\\,000\\ \\text{€}}$</p>\n<p>Taux de MCV $= 2\\,016\\,000 \\div 5\\,040\\,000 = \\mathbf{40\\ \\%}$</p>\n<p>Résultat $= 2\\,016\\,000 - 1\\,512\\,000 = \\mathbf{504\\,000\\ \\text{€}}$</p>\n<p><strong>2.</strong> $\\text{SR} = \\dfrac{1\\,512\\,000}{0{,}40} = \\mathbf{3\\,780\\,000\\ \\text{€}}$</p>\n<p>Marge de sécurité $= 5\\,040\\,000 - 3\\,780\\,000 = \\mathbf{1\\,260\\,000\\ \\text{€}}$</p>\n<p>Indice de sécurité $= 1\\,260\\,000 \\div 5\\,040\\,000 = \\mathbf{25\\ \\%}$ — le\nchiffre d'affaires peut reculer d'un quart avant que l'entreprise ne perde de\nl'argent.</p>\n<p><strong>3.</strong> $\\dfrac{3\\,780\\,000}{5\\,040\\,000} \\times 360 = 270$ jours, soit\n<strong>le 30 septembre</strong>.</p>\n<p>Contrôle utile en copie : au seuil, la MCV égale exactement les charges fixes.\n$3\\,780\\,000 \\times 0{,}40 = 1\\,512\\,000$ ✓</p>\n<p><strong>Erreur classique à éviter</strong> : diviser les charges fixes par la marge sur coût\nvariable au lieu du <em>taux</em> de marge. Le seuil est un chiffre d'affaires, donc\non divise par un taux, pas par un montant.</p>\n<h3>Exercice 3</h3>\n<p><strong>1.</strong> Coefficient d'imputation rationnelle :</p>\n<p>$$\\text{CIR} = \\frac{\\text{activité réelle}}{\\text{activité normale}} = \\frac{2\\,400}{3\\,000} = \\mathbf{0{,}80}$$</p>\n<p>Charges fixes imputées $= 150\\,000 \\times 0{,}80 = \\mathbf{120\\,000\\ \\text{€}}$</p>\n<p><strong>2.</strong> Coût de sous-activité $= 150\\,000 - 120\\,000 = \\mathbf{30\\,000\\ \\text{€}}$.\nCe montant n'est pas imputé au produit : il est porté en charge de la période,\nparce qu'il ne correspond à aucune production. C'est le coût de la capacité\ninemployée, et le rendre visible est tout l'objet de la méthode.</p>\n<p><strong>3.</strong> Les trois coûts unitaires :</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Calcul</th>\n<th>Coût unitaire</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Avec imputation rationnelle</td>\n<td>$(120\\,000 + 2\\,400 \\times 40) \\div 2\\,400 = 216\\,000 \\div 2\\,400$</td>\n<td><strong>90,00 €</strong></td>\n</tr>\n<tr>\n<td>Sans imputation rationnelle</td>\n<td>$(150\\,000 + 96\\,000) \\div 2\\,400 = 246\\,000 \\div 2\\,400$</td>\n<td><strong>102,50 €</strong></td>\n</tr>\n<tr>\n<td>À activité normale</td>\n<td>$(150\\,000 + 120\\,000) \\div 3\\,000 = 270\\,000 \\div 3\\,000$</td>\n<td><strong>90,00 €</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Ce que montre la comparaison : <strong>avec imputation rationnelle, le coût unitaire\nne dépend plus du niveau d'activité</strong> — 90 € dans les deux cas. Sans elle, le\ncoût unitaire monte mécaniquement quand l'activité baisse, puisque les mêmes\ncharges fixes se répartissent sur moins d'unités.</p>\n<p>La conséquence pratique est celle que le cours met en avant : sans imputation\nrationnelle, une entreprise qui calcule ses prix de vente sur ses coûts de\nrevient augmente ses prix quand ses ventes baissent, ce qui les fait baisser\ndavantage. L'imputation rationnelle brise cette spirale en isolant le coût de\nsous-activité, qui est un problème de gestion de la capacité et non un problème\nde produit.</p>\n<hr />\n"}, {"titre": "Les six pièges du programme", "html": "<h2>Les six pièges du programme</h2>\n<p><strong>Le coût d'achat n'est pas le prix d'achat.</strong> Les frais d'approvisionnement\nentrent dans la valorisation de l'entrée en stock. Les oublier fausse tout\nl'exercice en aval.</p>\n<p><strong>Fabriqués ≠ vendus.</strong> Le compte de stock de produits finis s'intercale entre\nles deux. C'est l'erreur la mieux récompensée par le barème, donc la plus\nguettée.</p>\n<p><strong>Les prestations réciproques se posent en système, pas en cascade.</strong> Répartir\nGestion puis Entretien sans résoudre les deux équations donne un faux total. Le\ncontrôle est immédiat : le total après répartition secondaire doit rester égal\nau total primaire, et les deux centres auxiliaires doivent être soldés à zéro.</p>\n<p><strong>Le seuil de rentabilité se divise par un taux.</strong> Charges fixes ÷ <em>taux</em> de\nMCV, pas ÷ MCV.</p>\n<p><strong>L'ordre de la chaîne ne se saute jamais.</strong> Achat → stock MP → consommation →\nproduction fabriquée → stock PF → production vendue → coût de revient →\nrésultat. Huit étapes, et chacune alimente la suivante.</p>\n<p><strong>Vérifier <code>SI + entrées − SF = sorties</code> sur chaque compte de stock.</strong> Trente\nsecondes, et cela attrape la quasi-totalité des erreurs arithmétiques avant\nqu'elles ne se propagent.</p>"}]}, {"cle": "blanc", "titre": "Devoir blanc — micro", "sousTitre": "TD 5 — mardi 3 novembre", "sections": [{"titre": "Pour le devoir du mardi 3 novembre, 14 h-15 h 30, salle 20-2008", "html": "<h2>Pour le devoir du mardi 3 novembre, 14 h-15 h 30, salle 20-2008</h2>\n<hr />\n"}, {"titre": "Ce que disent les registres de cours", "html": "<h2>Ce que disent les registres de cours</h2>\n<p><strong>La fiche du TD n° 5 n'est pas sur Moodle.</strong> L'espace de cours contient les\nfiches 1, 2, 3, 4 (version 2), 6, 7, 8 et 9. Dans une série numérotée de 1 à 9\npar ailleurs complète, y compris pour les séances postérieures, le seul numéro\nabsent est le cinquième. C'est la signature d'un sujet distribué en séance et\nnon diffusé à l'avance.</p>\n<p>Le forum « Questions sur le CM et les TD » ne contient que des réponses de\nJean-Sébastien Gharbi à des questions de septembre, sur le TD 1 et les diapos\ndu CM. Rien sur le devoir.</p>\n<p>Ta séance, groupe 6 : <strong>mardi 14 h-15 h 30, salle 20-2008, avec Eugénie\nWasef.</strong> Les dates du groupe sont 22/09, 29/09, 06/10, 13/10, puis <strong>03/11</strong>,\n10/11, 17/11, 24/11, 01/12 — les semaines 43 et 44 sautent. La cinquième\nséance est donc bien demain.</p>\n<p><strong>Le périmètre se déduit des quatre fiches déjà faites</strong> :</p>\n<table>\n<thead>\n<tr>\n<th>TD</th>\n<th>Thème</th>\n<th>Date</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Consommateur et maximisation d'utilité</td>\n<td>22 septembre</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Surplus du consommateur, production optimale, maximisation du profit</td>\n<td>29 septembre</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Équilibre de marché en concurrence parfaite, monopole</td>\n<td>6 octobre</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Duopoles de Cournot et de Bertrand</td>\n<td>13 octobre</td>\n</tr>\n</tbody>\n</table>\n<p>Le TD 6, qui porte sur la courbe des contrats et l'équilibre d'échange, est\npostérieur : il est hors périmètre. Le barème annoncé reste 8 points de cours\net 12 points d'exercices.</p>\n<p>Ce qui suit est un sujet blanc construit sur ce périmètre, dans le format de la\nmaison. Corrigé en seconde partie — à ne pas ouvrir avant d'avoir cherché.</p>\n<hr />\n"}, {"titre": "SUJET", "html": "<h2>SUJET</h2>\n<p><strong>Durée : 1 h 30. Calculatrice autorisée.</strong></p>\n<h3>Partie 1 — Questions de cours (8 points)</h3>\n<p><strong>1. (2 points)</strong> Définissez le taux marginal de substitution. Quelle relation\nentretient-il avec le rapport des prix lorsque le consommateur est à son panier\noptimal, et dans quel cas précis cette relation cesse-t-elle d'être une\négalité ?</p>\n<p><strong>2. (2 points)</strong> Un monopoleur maximise son profit. Montrez que la condition\nd'optimum s'écrit $Rm = Cm$, et expliquez pourquoi le monopoleur, contrairement\nà l'entreprise en concurrence parfaite, ne produit pas au point où le prix\négale le coût marginal.</p>\n<p><strong>3. (2 points)</strong> Qu'appelle-t-on fonction de meilleure réponse dans un\nduopole ? Pourquoi l'équilibre de Cournot se lit-il à l'intersection des deux\ncourbes de réaction ?</p>\n<p><strong>4. (2 points)</strong> Le paradoxe de Bertrand : énoncez le résultat et expliquez le\nmécanisme qui y conduit. Pourquoi deux entreprises suffisent-elles là où le\nmodèle de concurrence parfaite en suppose une infinité ?</p>\n<h3>Partie 2 — Exercices (12 points)</h3>\n<p><strong>Exercice 1 (4 points) — Consommateur.</strong></p>\n<p>Un consommateur dispose d'un revenu $R = 120$ et répartit sa dépense entre deux\nbiens $x$ et $y$, dont les prix unitaires sont $p_x = 2$ et $p_y = 4$. Sa\nfonction d'utilité est</p>\n<p>$$U = x^{1/3}\\, y^{2/3}$$</p>\n<ol>\n<li>Écrivez le lagrangien du programme du consommateur.</li>\n<li>Déterminez le panier optimal de consommation.</li>\n<li>Calculez le taux marginal de substitution de $x$ à $y$ au panier optimal et\n   vérifiez la condition d'équilibre.</li>\n<li>Le prix du bien $y$ passe à $p_y = 6$, le revenu et $p_x$ restant inchangés.\n   Déterminez le nouveau panier optimal. Que remarquez-vous sur la dépense\n   consacrée à chaque bien ?</li>\n</ol>\n<p><strong>Exercice 2 (3 points) — Monopole.</strong></p>\n<p>Une entreprise est en situation de monopole. La demande qui s'adresse à elle\ns'écrit $q_D = -3p + 60$. Son coût total est $CT = q^2 + 4q$.</p>\n<ol>\n<li>Écrivez la fonction inverse de demande.</li>\n<li>Déduisez-en la recette totale, la recette marginale et la recette moyenne.</li>\n<li>Déterminez le prix, la quantité et le profit à l'optimum.</li>\n<li>Que vaut la recette moyenne à l'optimum ? Commentez.</li>\n</ol>\n<p><strong>Exercice 3 (5 points) — Duopole.</strong></p>\n<p>Deux entreprises, notées 1 et 2, produisent un bien homogène : les\nconsommateurs ne font aucune différence entre les deux productions. La demande\ninverse sur le marché est</p>\n<p>$$p = 90 - y_T \\qquad \\text{avec } y_T = y_1 + y_2$$</p>\n<p>Les coûts totaux sont $CT_1 = 10\\,y_1$ et $CT_2 = 20\\,y_2$.</p>\n<ol>\n<li>Les entreprises se concurrencent par les quantités. Calculez les fonctions\n   de meilleure réponse de chacune.</li>\n<li>Représentez graphiquement les deux courbes de réaction.</li>\n<li>Déterminez les quantités d'équilibre, le prix d'équilibre et le profit de\n   chaque entreprise.</li>\n<li>Expliquez pourquoi l'entreprise 1 produit davantage et réalise un profit\n   supérieur.</li>\n<li>On suppose maintenant que les deux entreprises ont le même coût marginal,\n   égal à 10, et qu'elles se concurrencent en fixant simultanément un prix\n   qu'elles ne peuvent plus modifier. Quel sera le prix d'équilibre, et quel\n   sera le profit de chacune ? Justifiez.</li>\n</ol>\n<hr />\n"}, {"titre": "CORRIGÉ", "html": "<h2>CORRIGÉ</h2>\n<h3>Partie 1</h3>\n<p><strong>1. Taux marginal de substitution.</strong>\nLe TmS de $x$ à $y$ est la quantité de bien $y$ à laquelle le consommateur\naccepte de renoncer pour obtenir une unité supplémentaire de $x$ en restant sur\nla même courbe d'indifférence. C'est, au signe près, la pente de la courbe\nd'indifférence, et il s'écrit comme le rapport des utilités marginales :\n$TmS_{x,y} = Um_x / Um_y$.</p>\n<p>À l'optimum <strong>intérieur</strong>, le TmS égale le rapport des prix : $Um_x/Um_y =\np_x/p_y$. Géométriquement, la courbe d'indifférence est tangente à la droite de\nbudget.</p>\n<p>L'égalité cesse d'être vérifiée à un <strong>équilibre en coin</strong>, lorsque le panier\noptimal ne contient aucune quantité de l'un des deux biens. La tangence n'est\nalors plus atteignable dans l'orthant positif, et la condition devient une\ninégalité : le TmS reste supérieur (ou inférieur, selon le bien évincé) au\nrapport des prix sur tout le domaine admissible. C'est exactement le cas de\nl'exercice 2 du TD 1, avec $U = x(y+3)$ : le terme constant $+3$ fait que le\nbien $y$ procure de l'utilité même en quantité nulle, et pour un revenu assez\nfaible le consommateur n'en achète pas.</p>\n<p><strong>2. Optimum du monopoleur.</strong>\nLe profit s'écrit $\\pi(q) = RT(q) - CT(q)$. La condition du premier ordre donne\n$\\pi'(q) = RT'(q) - CT'(q) = 0$, soit $Rm = Cm$.</p>\n<p>La différence avec la concurrence parfaite tient à ce que le monopoleur\n<strong>affronte seul la demande du marché</strong> : il est faiseur de prix, et sa recette\nmarginale est inférieure à son prix, parce que vendre une unité de plus oblige\nà baisser le prix sur <strong>toutes</strong> les unités vendues. Formellement, avec\n$p(q)$ décroissante, $Rm = p(q) + q\\,p'(q) &lt; p(q)$.</p>\n<p>Comme à l'optimum $Rm = Cm$, il vient $p &gt; Cm$ : le monopoleur produit moins et\nvend plus cher que ne le ferait un marché concurrentiel. L'entreprise en\nconcurrence parfaite, elle, est preneuse de prix : $p$ est une constante, donc\n$Rm = p$, et la condition $Rm = Cm$ se confond avec $p = Cm$.</p>\n<p><strong>3. Fonction de meilleure réponse.</strong>\nC'est la fonction qui donne, pour chaque quantité produite par la concurrente,\nla quantité qui maximise le profit de l'entreprise considérée :\n$y_1 = R_1(y_2)$ et $y_2 = R_2(y_1)$. On l'obtient en maximisant $\\pi_1$ par\nrapport à $y_1$ <strong>en tenant $y_2$ pour donné</strong>.</p>\n<p>L'équilibre de Cournot est un équilibre de Nash en quantités : aucune des deux\nne gagne à dévier unilatéralement. C'est donc un couple $(y_1^<em>, y_2^</em>)$ tel\nque chacune joue sa meilleure réponse à l'autre — c'est-à-dire un point qui\nappartient <strong>simultanément aux deux courbes de réaction</strong>, soit leur\nintersection.</p>\n<p><strong>4. Paradoxe de Bertrand.</strong>\nRésultat : avec deux entreprises seulement, un bien homogène, des coûts\nmarginaux identiques et constants, et une concurrence en prix, l'équilibre\ns'établit à $p_1 = p_2 = Cm$ et les profits sont nuls. Le résultat de\nconcurrence parfaite est atteint avec deux producteurs.</p>\n<p>Le mécanisme : le bien étant homogène, le consommateur achète intégralement à\nla moins chère. Toute entreprise dont le prix dépasse celui de sa rivale ne\nvend rien ; toute entreprise qui s'aligne sur un prix supérieur au coût\nmarginal a intérêt à le sous-coter d'un centime pour rafler tout le marché. La\nsous-cotation ne s'arrête que lorsqu'elle cesse d'être profitable, c'est-à-dire\nau coût marginal. En dessous, l'entreprise vendrait à perte.</p>\n<p>Deux entreprises suffisent parce que ce n'est pas le <strong>nombre</strong> de concurrents\nqui discipline le prix, mais la <strong>variable de concurrence</strong> et l'homogénéité du\nbien : en prix, avec un bien homogène, la demande résiduelle est totalement\ndiscontinue, et cette discontinuité fait tout le travail qu'une infinité\nd'entreprises fait en Cournot.</p>\n<h3>Exercice 1</h3>\n<p><strong>1.</strong> $\\mathcal{L}(x,y,\\lambda) = x^{1/3} y^{2/3} + \\lambda\\,(120 - 2x - 4y)$</p>\n<p><strong>2.</strong> Conditions du premier ordre :</p>\n<p>$$\\frac{\\partial \\mathcal{L}}{\\partial x} = \\tfrac{1}{3}x^{-2/3}y^{2/3} - 2\\lambda = 0\n\\qquad\n\\frac{\\partial \\mathcal{L}}{\\partial y} = \\tfrac{2}{3}x^{1/3}y^{-1/3} - 4\\lambda = 0$$</p>\n<p>En divisant la première par la seconde, $\\lambda$ disparaît :</p>\n<p>$$\\frac{\\tfrac{1}{3}x^{-2/3}y^{2/3}}{\\tfrac{2}{3}x^{1/3}y^{-1/3}} = \\frac{2}{4}\n\\quad\\Longrightarrow\\quad \\frac{1}{2}\\cdot\\frac{y}{x} = \\frac{1}{2}\n\\quad\\Longrightarrow\\quad y = x$$</p>\n<p>Report dans la contrainte $2x + 4y = 120$ : $6x = 120$, donc\n$$\\boxed{x^<em> = 20,\\quad y^</em> = 20}$$</p>\n<p><strong>3.</strong> $TmS_{x,y} = Um_x/Um_y = \\dfrac{\\tfrac{1}{3}x^{-2/3}y^{2/3}}{\\tfrac{2}{3}x^{1/3}y^{-1/3}} = \\dfrac{1}{2}\\cdot\\dfrac{y}{x}$</p>\n<p>Au panier optimal : $TmS = \\tfrac{1}{2}\\cdot\\tfrac{20}{20} = 0{,}5$. Et\n$p_x/p_y = 2/4 = 0{,}5$. L'égalité est vérifiée, l'optimum est bien intérieur.</p>\n<p><strong>4.</strong> Avec $p_y = 6$, la même division donne $\\tfrac{1}{2}\\cdot\\tfrac{y}{x} =\n\\tfrac{2}{6}$, soit $y = \\tfrac{2}{3}x$. La contrainte $2x + 6y = 120$ devient\n$2x + 4x = 120$, d'où $x^<em> = 20$ et $y^</em> = 40/3 \\approx 13{,}33$.</p>\n<p>Remarque attendue : la dépense en $x$ vaut $2 \\times 20 = 40$, soit $1/3$ du\nrevenu, et la dépense en $y$ vaut $6 \\times 40/3 = 80$, soit $2/3$ du revenu —\nexactement comme avant le changement de prix. C'est la propriété\ncaractéristique des fonctions <strong>Cobb-Douglas</strong> : les parts de budget consacrées\nà chaque bien sont constantes et égales aux exposants normalisés, quels que\nsoient les prix et le revenu. La quantité de $x$ ne bouge d'ailleurs pas, parce\nque ni $p_x$ ni $R$ n'ont changé : il n'y a aucun effet croisé.</p>\n<h3>Exercice 2</h3>\n<p><strong>1.</strong> $q = -3p + 60 \\Rightarrow p = 20 - \\dfrac{q}{3}$</p>\n<p><strong>2.</strong> $RT = p\\,q = 20q - \\dfrac{q^2}{3}$, donc\n$Rm = \\dfrac{dRT}{dq} = 20 - \\dfrac{2q}{3}$ et\n$R_{moy} = \\dfrac{RT}{q} = 20 - \\dfrac{q}{3} = p$.</p>\n<p><strong>3.</strong> $Cm = \\dfrac{dCT}{dq} = 2q + 4$. L'optimum impose $Rm = Cm$ :</p>\n<p>$$20 - \\frac{2q}{3} = 2q + 4 \\quad\\Longrightarrow\\quad 16 = \\frac{8q}{3}\n\\quad\\Longrightarrow\\quad \\boxed{q^* = 6}$$</p>\n<p>$p^<em> = 20 - 2 = \\boxed{18}$. $RT = 108$, $CT = 36 + 24 = 60$, donc\n$\\pi^</em> = \\boxed{48}$.</p>\n<p><strong>4.</strong> $R_{moy} = 108/6 = 18 = p^<em>$. La recette moyenne est toujours égale au\nprix, par construction. L'observation qui compte est ailleurs : $Rm = 20 - 4 =\n16$ est strictement inférieure à $R_{moy} = 18$, et le coût marginal vaut\n$Cm = 16$. Donc $p^</em> = 18 &gt; Cm = 16$ : le monopoleur fixe un prix supérieur à\nson coût marginal, et la différence est sa marge de monopole.</p>\n<h3>Exercice 3</h3>\n<p><strong>1.</strong> Profit de l'entreprise 1 :\n$\\pi_1 = (90 - y_1 - y_2)\\,y_1 - 10\\,y_1$.</p>\n<p>$$\\frac{\\partial \\pi_1}{\\partial y_1} = 90 - 2y_1 - y_2 - 10 = 0\n\\quad\\Longrightarrow\\quad y_1 = \\frac{80 - y_2}{2}$$</p>\n<p>De même, $\\pi_2 = (90 - y_1 - y_2)\\,y_2 - 20\\,y_2$ :</p>\n<p>$$\\frac{\\partial \\pi_2}{\\partial y_2} = 90 - y_1 - 2y_2 - 20 = 0\n\\quad\\Longrightarrow\\quad y_2 = \\frac{70 - y_1}{2}$$</p>\n<p><strong>2.</strong> Deux droites décroissantes dans le plan $(y_1, y_2)$. Celle de\nl'entreprise 1 coupe l'axe des $y_1$ en 40 et celle des $y_2$ en 80 ; celle de\nl'entreprise 2 coupe l'axe des $y_2$ en 35 et celle des $y_1$ en 70.\nL'équilibre est à l'intersection.</p>\n<p><strong>3.</strong> Substitution :</p>\n<p>$$y_1 = \\frac{80 - \\frac{70 - y_1}{2}}{2} = \\frac{160 - 70 + y_1}{4}\n= \\frac{90 + y_1}{4}$$</p>\n<p>$$4y_1 = 90 + y_1 \\quad\\Longrightarrow\\quad \\boxed{y_1^<em> = 30}\n\\qquad y_2^</em> = \\frac{70 - 30}{2} = \\boxed{20}$$</p>\n<p>$y_T = 50$, donc $p^* = 90 - 50 = \\boxed{40}$.</p>\n<p>$\\pi_1 = (40 - 10)\\times 30 = \\boxed{900}$ et\n$\\pi_2 = (40 - 20)\\times 20 = \\boxed{400}$.</p>\n<p><strong>4.</strong> L'entreprise 1 a un coût marginal de 10 contre 20 pour l'entreprise 2.\nDeux effets se cumulent. <strong>Effet direct</strong> : à quantité donnée, sa marge\nunitaire est plus large, donc sa meilleure réponse est plus élevée pour toute\nvaleur de $y_2$ — sa courbe de réaction est translatée vers le haut. <strong>Effet\nstratégique</strong> : l'entreprise 2, anticipant une production élevée de sa rivale,\nréduit la sienne, ce qui autorise l'entreprise 1 à produire plus encore.\nL'avantage de coût se traduit donc par une part de marché plus grande <em>et</em> une\nmarge unitaire plus forte — d'où un profit plus que double, alors que l'écart\nde coût n'est que de 10.</p>\n<p><strong>5.</strong> C'est le <strong>paradoxe de Bertrand</strong>. Avec un bien homogène et des coûts\nmarginaux identiques, chaque entreprise a intérêt à sous-coter tant que le prix\ndépasse le coût marginal, puisqu'elle capte alors l'intégralité du marché. La\nsous-cotation ne s'arrête qu'à $p_1 = p_2 = Cm = 10$ : en dessous, l'entreprise\nvendrait à perte, et au-dessus elle serait évincée.</p>\n<p>Donc $p^<em> = 10$, la quantité totale est $y_T = 90 - 10 = 80$, chaque entreprise\nen produit 40, et </em><em>le profit de chacune est nul</em>*.</p>\n<p>Le contraste avec la question 3 est l'enseignement du sujet : les mêmes deux\nentreprises, le même marché, et un résultat opposé selon qu'elles se\nconcurrencent par les quantités ou par les prix. En Cournot le prix est 40 et\nles profits positifs ; en Bertrand le prix tombe au coût marginal. <strong>Ce n'est\npas le nombre d'entreprises qui détermine l'intensité de la concurrence, c'est\nla variable stratégique.</strong></p>\n<hr />\n"}, {"titre": "Les quatre pièges du périmètre", "html": "<h2>Les quatre pièges du périmètre</h2>\n<p><strong>Le lagrangien se résout par division, pas par substitution de $\\lambda$.</strong>\nDiviser la première condition du premier ordre par la seconde élimine\n$\\lambda$ en une ligne et donne directement la relation entre $x$ et $y$.\nCalculer $\\lambda$ explicitement fait perdre cinq minutes et introduit des\nerreurs de signe.</p>\n<p><strong>En monopole, ne jamais poser $p = Cm$.</strong> C'est la condition de concurrence\nparfaite. En monopole, $Rm = Cm$, et $Rm \\ne p$. L'erreur est systématique et\ncoûte tout l'exercice.</p>\n<p><strong>En Cournot, dériver en tenant la quantité de l'autre pour une constante.</strong>\nC'est ce qui fait de $\\partial\\pi_1/\\partial y_1$ une meilleure réponse et non\nun optimum joint. Traiter $y_T$ comme une seule variable conduit au résultat de\ncartel, qui n'est pas demandé.</p>\n<p><strong>Le TmS est un rapport d'utilités marginales, pas une dérivée de $U$.</strong>\nEt quand l'optimum est en coin, l'égalité avec le rapport des prix tombe. La\nquestion de cours 1 porte précisément là-dessus, et l'exercice 2 du TD 1 en\nétait l'illustration.</p>"}]}, {"cle": "monnaie", "titre": "Monnaie et financement", "sousTitre": "Chossat Noblot — 6 ECTS, 100 % terminal", "sections": [{"titre": "Véronique Chossat Noblot — UE 3.2 — 6 ECTS — écrit terminal 1 h 30, 100 %", "html": "<h2>Véronique Chossat Noblot — UE 3.2 — 6 ECTS — écrit terminal 1 h 30, 100 %</h2>\n<p>Carte établie le 2 novembre 2026 à partir de la présentation du cours, du\nchapitre introductif et des chapitres 1 et 2 déposés sur Moodle. Les chapitres\n3 et 4 ne sont pas encore en ligne : le cours magistral court jusqu'au\n24 novembre.</p>\n<hr />\n"}, {"titre": "1. L'enjeu, posé franchement", "html": "<h2>1. L'enjeu, posé franchement</h2>\n<p>Six ECTS — un cinquième du semestre, à égalité avec la microéconomie. Mais la\nmicro a un contrôle continu ; celle-ci n'en a aucun. <strong>Trente heures de cours\nmagistral se jouent intégralement sur un écrit d'une heure trente en\ndécembre.</strong> C'est la seule matière du semestre où rien n'est acquis avant\nl'épreuve et où rien ne peut l'être après.</p>\n<p>L'enseignante l'écrit elle-même en ouverture : <em>« cours important, bases pour\nle cours de macroéconomie »</em>. Ce qui se perd ici se repaiera au semestre 4.</p>\n<p><strong>Format de l'épreuve</strong>, annoncé en présentation : <strong>questions de réflexion,\nQCM et QRM</strong>, précisions en novembre. Cette combinaison a une conséquence\ndirecte sur la façon de travailler. Le QCM sanctionne les mots-clés, les dates\net les auteurs, qui ne s'improvisent pas. La question de réflexion sanctionne\nles controverses, pas les définitions. Un fichage qui se contente des\ndéfinitions rate la moitié du barème.</p>\n<p>Mention explicite également : <strong>épreuve sans IA</strong>, et avertissement en\nbibliographie sur l'usage de l'IA pour apprendre les mécanismes. À prendre au\nsérieux pour cette matière en particulier : ce qui est demandé, c'est de\nrestituer des oppositions théoriques, pas de produire un texte.</p>\n<hr />\n"}, {"titre": "2. Le plan du cours", "html": "<h2>2. Le plan du cours</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Chapitre</th>\n<th>État</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>—</td>\n<td>Les prémisses de la monnaie</td>\n<td>déposé</td>\n</tr>\n<tr>\n<td>1</td>\n<td>L'émergence de la monnaie</td>\n<td>déposé</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Détention monétaire et théories économiques</td>\n<td>déposé</td>\n</tr>\n<tr>\n<td>3</td>\n<td>La création monétaire</td>\n<td>à venir</td>\n</tr>\n<tr>\n<td>4</td>\n<td>La politique monétaire</td>\n<td>à venir</td>\n</tr>\n<tr>\n<td>[5]</td>\n<td>Le système monétaire international</td>\n<td>entre crochets au plan — probablement hors épreuve</td>\n</tr>\n</tbody>\n</table>\n<p>Les chapitres 3 et 4 portent le cœur analytique du cours, et ce sont ceux qui\nmènent à la BCE, objectif annoncé du cours. Ils tomberont. Surveiller leur\ndépôt sur Moodle.</p>\n<hr />\n"}, {"titre": "3. Chapitre introductif — l'économie du troc", "html": "<h2>3. Chapitre introductif — l'économie du troc</h2>\n<p>Quatre conditions d'émergence d'une économie de troc : communauté réduite,\noffre restreinte de biens, volonté commune d'échanger, prix d'échange faciles à\nétablir.</p>\n<p>Trois obstacles à son maintien dans une économie complexe — et ce sont eux qui\ntombent : <strong>le temps de recherche</strong> (<em>search costs</em>), <strong>la double coïncidence\ndes désirs</strong>, <strong>le calcul de la valeur relative des biens</strong>.</p>\n<p>La lecture théorique à retenir : ces trois obstacles sont des <strong>coûts de\ntransaction</strong> au sens de Coase et Williamson — coûts de recherche, de\nnégociation, de calcul. La monnaie se comprend alors comme une institution qui\nabaisse des coûts de transaction, pas comme une commodité technique.</p>\n<p>Le calcul combinatoire est à savoir refaire : dans une économie à $n$ biens, le\nnombre de prix relatifs est $n(n-1)/2$. À cinq biens, dix prix relatifs ; la\nmonnaie en ramène le nombre à cinq. C'est le chiffrage classique de la\n« complexité informationnelle » du troc.</p>\n<hr />\n"}, {"titre": "4. Chapitre 1 — l'émergence de la monnaie", "html": "<h2>4. Chapitre 1 — l'émergence de la monnaie</h2>\n<h3>Les formes évolutives</h3>\n<p>Monnaie marchandise → monnaie métallique → billet de banque → monnaie\nscripturale.</p>\n<p>Sur la monnaie métallique, deux points précis : les quatre propriétés qui font\nchoisir les métaux précieux — <strong>divisibles, robustes, malléables, relativement\nrares</strong> — et la distinction <strong>monnaie pesée / monnaie comptée</strong>.</p>\n<p><strong>Bimétallisme contre monométallisme</strong> est le passage le plus susceptible de\ntomber en QCM. Le Franc Germinal (1803-1914) fixe un pair légal de 15,5 pièces\nd'argent pour une pièce d'or. Dès que la parité commerciale s'écarte du pair\nlégal, la <strong>loi de Gresham</strong> joue : la mauvaise monnaie chasse la bonne, parce\nque les agents gardent celle qui est sous-évaluée légalement et dépensent\nl'autre. D'où l'instabilité du bimétallisme, et le ralliement progressif à\nl'or : Grande-Bretagne 1816, États-Unis 1853, France 1876, Russie et Japon\n1897.</p>\n<h3>La controverse Currency School / Banking School</h3>\n<p>Le cœur théorique du chapitre, et une question de réflexion toute trouvée.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Currency School</th>\n<th>Banking School</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Auteurs</td>\n<td>Ricardo, Say</td>\n<td>Tooke, Fullarton</td>\n</tr>\n<tr>\n<td>Principe</td>\n<td>$VM = EO$</td>\n<td>$VM &gt; EO$</td>\n</tr>\n<tr>\n<td>Rôle de la banque</td>\n<td>passive</td>\n<td>active</td>\n</tr>\n<tr>\n<td>Origine des crises</td>\n<td>émission excessive</td>\n<td>manque de débouchés</td>\n</tr>\n<tr>\n<td>Système adopté</td>\n<td>Grande-Bretagne (Acte de Peel, 1844)</td>\n<td>France</td>\n</tr>\n</tbody>\n</table>\n<p>$VM$ = volume de monnaie papier en circulation, $EO$ = encaisse\ncorrespondante en or.</p>\n<p>Le désaccord porte sur une question qui n'a rien d'historique : <strong>la quantité\nde monnaie doit-elle être ancrée sur une contrepartie, ou s'ajuster aux besoins\nde l'économie ?</strong> C'est la même question que celle qui traverse le chapitre 3\nsur la création monétaire et le chapitre 4 sur la politique de la BCE. Le lien\nentre les trois chapitres est là.</p>\n<h3>Les régimes de convertibilité</h3>\n<p>Étalon-or simple → étalon-lingot d'or (quantité minimale d'or exigée pour\nconvertir) → inconvertibilité. Trois notions à ne pas confondre : <strong>cours\nlibre, cours légal, cours forcé</strong>. Le cours forcé, c'est l'inconvertibilité\nassortie de l'obligation d'accepter.</p>\n<p>Dates françaises à tenir, celles du tableau du cours : <strong>1800</strong> création de la\nBanque de France, <strong>1803</strong> monopole d'émission sur Paris, <strong>1848</strong>\ninconvertibilité et cours légal par décret, <strong>1878</strong> rétablissement de la\nconvertibilité, <strong>5 août 1914</strong> suppression, <strong>25 juin 1928</strong> loi Poincaré\n(convertibilité en lingots seulement), <strong>1er octobre 1936</strong> abrogation de la\ndéfinition en or du franc.</p>\n<h3>La contre-histoire de la monnaie</h3>\n<p>Section 2, et la plus intéressante pour une question de réflexion. La thèse\nhabituelle — une histoire linéaire du troc vers la dématérialisation — est\ncontestée pour trois raisons :</p>\n<ol>\n<li><strong>La « fable du troc »</strong> : l'ethnologie et l'archéologie récentes\n   n'identifient aucune société fonctionnant d'abord au troc pur. Le moment\n   zéro postulé par la théorie n'a jamais été observé.</li>\n<li><strong>Les paléomonnaies sont des signes politiques et symboliques</strong> autant que\n   des instruments d'échange. Les Baruya de Nouvelle-Guinée étudiés par\n   <strong>Godelier</strong>, le potlatch des Kwakiutl étudié par <strong>Polanyi</strong>.</li>\n<li><strong>La vision mécaniste et linéaire</strong> ne rend pas compte de la complexité\n   réelle de l'histoire monétaire.</li>\n</ol>\n<p>Articulation à retenir : la section 1 raconte l'histoire standard, la section 2\nla démonte. Restituer la première sans la seconde, c'est répondre à côté d'une\nquestion de réflexion.</p>\n<h3>Les trois fonctions et les formes actuelles</h3>\n<p><strong>Unité de compte</strong> (étalon des valeurs, réduction de la complexité\ninformationnelle), <strong>instrument des échanges</strong> (la monnaie s'intercale, sépare\nl'acte d'achat de l'acte de vente, éteint une dette), <strong>réserve de valeur</strong>\n(Keynes : lien entre le passé et le futur ; avantage de liquidité parfaite et\nd'absence de risque, inconvénient majeur de l'inflation).</p>\n<p>Une distinction que le cours signale explicitement pour éviter l'ambiguïté :\nl'<strong>unité de compte</strong> est un outil de mesure concrète, elle ne dit rien du\n<strong>fondement de la valeur</strong>. Sur ce fondement, deux écoles : valeur-travail chez\nles classiques et Marx, valeur-utilité chez les néoclassiques et Say.</p>\n<p>Formes actuelles : fiduciaire (divisionnaire à pouvoir libératoire limité,\nbillets), scripturale (soldes créditeurs des dépôts à vue, <strong>au passif du bilan\ndes banques</strong>), alternatives (monnaies locales — plus de 80 en France, base\nlégale par la loi ESS du 31 juillet 2014 ; cryptomonnaies — que le cours\nqualifie de <strong>cryptoactifs plutôt que de monnaies</strong>, faute de remplir les trois\nfonctions).</p>\n<p>Deux confusions à éviter, et le cours les signale toutes les deux :\n<strong>instrument n'est pas monnaie</strong> (le chèque, la carte, le virement sont des\nsupports de circulation de la monnaie scripturale), et <strong>DAV n'est pas livret\nd'épargne</strong> — seuls les dépôts à vue sont dans M1.</p>\n<hr />\n"}, {"titre": "5. Chapitre 2 — détention monétaire et théories économiques", "html": "<h2>5. Chapitre 2 — détention monétaire et théories économiques</h2>\n<p>Trois sections, et elles s'enchaînent logiquement : la monnaie est-elle neutre,\nles agents sont-ils victimes d'illusion monétaire, et que dit la théorie\nquantitative.</p>\n<h3>La neutralité de la monnaie</h3>\n<p>Les classiques : la monnaie est un voile, elle n'affecte pas les variables\nréelles. <strong>Keynes</strong> rompt avec cette position — citation du <em>Traité sur la\nmonnaie</em> (1930) : adapter les conclusions d'une économie à salaires réels au\nmonde d'une économie monétaire est <em>« extraordinairement difficile, et\npeut-être impossible »</em>.</p>\n<p>Les quatre régimes d'anticipations, à distinguer précisément car ils reviennent\nen section 2 : <strong>statiques, extrapolatives, adaptatives, rationnelles</strong>.</p>\n<h3>L'illusion monétaire</h3>\n<p>Définition, puis trois distinctions : revenu réel / revenu nominal, épargne\nintentionnelle / épargne forcée.</p>\n<p>La séquence des trois positions est le passage le plus dense du chapitre :</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Illusion monétaire ?</th>\n<th>Conséquence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Keynes</strong></td>\n<td>oui, les agents consomment selon leur revenu courant</td>\n<td>la politique monétaire agit</td>\n</tr>\n<tr>\n<td><strong>Friedman</strong> — monétarisme I, anticipations adaptatives</td>\n<td>à court terme seulement ; consommation fixée sur le revenu permanent</td>\n<td>inflation définitive, résorption du chômage <strong>temporaire</strong></td>\n</tr>\n<tr>\n<td><strong>Lucas</strong> — monétarisme II, anticipations rationnelles</td>\n<td>non, pas même à court terme</td>\n<td>inflation définitive, <strong>sans aucune</strong> résorption du chômage</td>\n</tr>\n</tbody>\n</table>\n<p>Avec le <strong>NAIRU</strong> — <em>Non Accelerating Inflation Rate of Unemployment</em> — et la\ndistinction entre niveau de revenu naturel ($Q_N$, taux de chômage naturel) et\nniveau de plein emploi ($Q_{PE}$).</p>\n<p>C'est le cœur du chapitre et le matériau d'une question de réflexion sur\nl'efficacité de la politique monétaire. Le ressort de la démonstration tient en\nune phrase : <strong>ce qui décide de l'efficacité d'une politique monétaire, c'est\nla façon dont les agents forment leurs anticipations.</strong> Plus les anticipations\nsont rationnelles, moins la politique peut surprendre, moins elle agit.</p>\n<h3>La théorie quantitative de la monnaie</h3>\n<p>Origines lointaines : <strong>Oresme</strong> (XIVe), <strong>Bodin</strong> (XVIe), <strong>Malestroit</strong>\n(XVIe), <strong>Locke</strong> (XVIIe), <strong>Hume</strong> (XVIIIe).</p>\n<p>Deux versions à ne pas confondre — c'est exactement le type de distinction\nqu'un QCM vise.</p>\n<p><strong>Version patrimoniale</strong> (approche de Cambridge). $OM = DM$, offre exogène\ndécidée par les autorités monétaires, demande de monnaie pour trois motifs :\n<strong>transaction</strong> (fonction du revenu), <strong>précaution</strong>, <strong>spéculation</strong> (fonction\ndu taux d'intérêt). Le taux d'intérêt y est le prix de marché de la monnaie, et\nla valeur de la monnaie l'inverse du niveau général des prix. Formulation :\n$M = \\frac{1}{V}PQ$, soit $M = kPQ$ avec $k = 1/V$.</p>\n<p><strong>Version circulat
