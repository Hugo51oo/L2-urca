<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1626">
<title>Cours L2 — URCA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L2">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PALETTE — bloc unique à remplacer par celle de SafeSpot.
   Coller ici le :root de safespot/index.html suffit à reskinner
   toute l'application ; aucun autre endroit ne contient de couleur
   en dur.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fond:        #0E1626;
  --fond-2:      #16223A;
  --fond-3:      #1F2E4D;
  --ligne:       #28395C;
  --texte:       #E9E9E6;
  --texte-doux:  #94A0B6;
  --accent:      #C08A4E;
  --accent-vif:  #E0AB6D;

  /* une teinte par cours : le changement de couleur EST l'information
     qui dit qu'on a changé de matière */
  --h-maquette:  14;
  --h-plan:      46;
  --h-blanccc:   24;
  --h-blanc:     352;
  --h-monnaie:   128;
  --h-tefi:      88;
  --h-micro:     202;
  --h-couts:     38;
  --h-enquete:   162;
  --h-sciences:  280;
  --h-synthese:  12;
  --h-moodle:    190;

  --duree:       .34s;
  --courbe:      cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--fond);color:var(--texte);
  font-family:"Newsreader",Georgia,serif;
  font-size:17px;line-height:1.62;
  min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

/* teinte active, recalculée à chaque changement de page */
body{
  --h:var(--h-maquette);
  --teinte:      hsl(var(--h) 46% 62%);
  --teinte-doux: hsl(var(--h) 40% 22%);
  --teinte-voile:hsl(var(--h) 55% 60% / .09);
  transition:background var(--duree) var(--courbe);
}

/* ─────────── coiffe ─────────── */
header{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(hsl(var(--h) 30% 9% / .94),hsl(var(--h) 30% 9% / .72));
  border-bottom:1px solid var(--ligne);
  transition:background var(--duree) var(--courbe);
}
.coiffe{max-width:760px;margin:0 auto;padding:14px 20px 0}
.marque{display:flex;align-items:baseline;gap:10px}
.accueil{display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:30px;height:30px;margin:-4px -2px -4px -8px;align-self:center;
  color:var(--texte-doux);border-radius:9px;text-decoration:none;
  transition:background .18s,color .18s}
.accueil:hover,.accueil:focus-visible{background:var(--fond-3);color:var(--texte)}
.accueil svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.marque b{font-weight:600;font-size:19px;letter-spacing:-.01em}
.marque span{font-size:13px;color:var(--texte-doux)}
.jauge{height:2px;background:var(--ligne);margin-top:12px;border-radius:2px;overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:var(--teinte);
  transition:width .18s linear,background var(--duree) var(--courbe)}

/* ─────────── onglets de matière ─────────── */
nav.matieres{
  display:flex;gap:6px;overflow-x:auto;padding:12px 20px 13px;
  max-width:760px;margin:0 auto;scrollbar-width:none;
}
nav.matieres::-webkit-scrollbar{display:none}
.onglet{
  flex:0 0 auto;border:1px solid var(--ligne);background:transparent;
  color:var(--texte-doux);border-radius:999px;padding:7px 15px;
  font:inherit;font-size:13.5px;font-family:ui-sans-serif,system-ui,sans-serif;
  cursor:pointer;white-space:nowrap;
  transition:color .2s,border-color .2s,background .2s,transform .12s var(--courbe);
}
.onglet:hover{color:var(--texte)}
.onglet:active{transform:scale(.96)}
.onglet[aria-current=true]{
  color:hsl(var(--ho) 50% 72%);
  border-color:hsl(var(--ho) 45% 40%);
  background:hsl(var(--ho) 50% 55% / .12);
}
.onglet:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}

/* ─────────── corps ─────────── */
main{max-width:760px;margin:0 auto;padding:30px 20px 120px}
.entete{margin-bottom:26px}
.entete h1{
  font-size:clamp(28px,7vw,40px);font-weight:600;line-height:1.14;
  letter-spacing:-.02em;
}
.entete p{color:var(--texte-doux);font-size:15px;margin-top:5px}

/* le fondu : c'est le moment que l'application soigne */
.page{animation:entree var(--duree) var(--courbe) both}
.page.sortie{animation:sortie .17s var(--courbe) both}
@keyframes entree{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sortie{from{opacity:1}to{opacity:0;transform:translateY(-6px)}}

/* voile de teinte qui balaie l'écran au changement de matière */
#voile{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(120% 80% at 50% 0%,var(--teinte-voile),transparent 70%);
}
#voile.actif{animation:balayage .5s var(--courbe)}
@keyframes balayage{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

/* ─────────── contenu markdown ─────────── */
h2{
  font-size:23px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
  margin:44px 0 14px;padding-top:22px;border-top:1px solid var(--ligne);
}
.page > .bloc:first-child h2{border-top:0;padding-top:0;margin-top:8px}
h3{font-size:18.5px;font-weight:600;margin:28px 0 10px;color:hsl(var(--h) 38% 78%)}
p{margin:0 0 14px;max-width:68ch}
strong{font-weight:600;color:hsl(var(--h) 45% 84%)}
em{font-style:italic;color:var(--texte-doux)}
ul,ol{margin:0 0 16px 20px}
li{margin-bottom:7px;max-width:66ch}
li::marker{color:var(--teinte)}
hr{border:0;border-top:1px solid var(--ligne);margin:34px 0}
a{color:var(--teinte);text-underline-offset:3px}

code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--fond-3);padding:2px 6px;border-radius:4px;color:hsl(var(--h) 40% 80%);
}
pre{
  background:var(--fond-2);border:1px solid var(--ligne);border-left:2px solid var(--teinte);
  border-radius:5px;padding:15px 17px;overflow-x:auto;margin:0 0 18px;
  font-size:13.5px;line-height:1.55;
}
pre code{background:none;padding:0;color:var(--texte-doux);font-size:inherit}

.tableau{overflow-x:auto;margin:0 0 20px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:420px;
  font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--ligne);vertical-align:top}
th{color:var(--texte-doux);font-weight:600;font-size:12.5px;
  background:var(--fond-2);position:sticky;top:0}
tbody tr:hover{background:hsl(var(--h) 40% 50% / .05)}
blockquote{
  border-left:2px solid var(--teinte);padding:4px 0 4px 18px;margin:0 0 18px;
  color:var(--texte-doux);font-style:italic;
}

/* ─────────── sommaire flottant ─────────── */
.sommaire{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(transparent,hsl(var(--h) 30% 7% / .9) 26%);
  padding:26px 20px calc(16px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.sommaire .barre{
  max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;
  pointer-events:auto;
}
.bouton{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--fond-2);border:1px solid var(--ligne);color:var(--texte);
  border-radius:11px;padding:13px 14px;font:inherit;font-size:14.5px;
  font-family:ui-sans-serif,system-ui,sans-serif;cursor:pointer;
  transition:transform .12s var(--courbe),border-color .2s,background .2s;
}
.bouton:hover{border-color:hsl(var(--h) 40% 45%)}
.bouton:active{transform:scale(.97)}
.bouton:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.bouton.principal{background:hsl(var(--h) 45% 55% / .16);border-color:hsl(var(--h) 45% 45%)}
.bouton svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* panneau des sections */
#panneau{
  position:fixed;inset:0;z-index:70;display:none;
  background:hsl(var(--h) 34% 5% / .78);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#panneau.ouvert{display:block;animation:fondu .22s var(--courbe)}
@keyframes fondu{from{opacity:0}to{opacity:1}}
#panneau .liste{
  position:absolute;left:0;right:0;bottom:0;max-height:76dvh;overflow-y:auto;
  background:var(--fond-2);border-top:1px solid var(--ligne);
  border-radius:18px 18px 0 0;padding:10px 0 calc(18px + env(safe-area-inset-bottom));
  animation:monte .3s var(--courbe);
}
@keyframes monte{from{transform:translateY(26px)}to{transform:none}}
.poignee{width:36px;height:4px;background:var(--ligne);border-radius:3px;margin:6px auto 12px}
#panneau button{
  display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--texte);font:inherit;font-size:15.5px;padding:12px 24px;cursor:pointer;
  font-family:ui-sans-serif,system-ui,sans-serif;
  border-left:2px solid transparent;
}
#panneau button:hover{background:var(--fond-3)}
#panneau button[aria-current=true]{border-left-color:var(--teinte);color:hsl(var(--h) 45% 78%)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media (min-width:900px){
  body{font-size:17.5px}
  main{padding-top:38px}
}
</style>
</head>
<body>

<header>
  <div class="coiffe">
    <div class="marque">
      <a class="accueil" href="index.html" aria-label="Accueil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <b id="m-titre">—</b><span id="m-sous"></span>
    </div>
    <div class="jauge"><i id="jauge"></i></div>
  </div>
  <nav class="matieres" id="matieres" aria-label="Matières"></nav>
</header>

<main id="corps" aria-live="polite"></main>

<div class="sommaire">
  <div class="barre">
    <button class="bouton" id="b-prec" aria-label="Matière précédente">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Précédent
    </button>
    <button class="bouton principal" id="b-sections">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Sections
    </button>
    <button class="bouton" id="b-suiv" aria-label="Matière suivante">
      Suivant <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<div id="voile"></div>
<div id="panneau" role="dialog" aria-modal="true" aria-label="Sections">
  <div class="liste"><div class="poignee"></div><div id="liste-sections"></div></div>
</div>

<script>
const DOCS = /*__DONNEES__*/;
const $ = s => document.querySelector(s);
let index = 0;

/* ═══ retour haptique ═══
   L'API Vibration n'existe que sur Android et quelques navigateurs de
   bureau : Safari, donc tout iPhone et tout Mac, ne l'implémente pas.
   Là où elle manque, on rend le retour par un très court repli sonore
   (WebAudio) plus la réponse visuelle du bouton, ce qui donne la même
   sensation de confirmation sans prétendre vibrer.                     */
const haptique = (() => {
  let ctx = null, autorise = false;
  const peutVibrer = typeof navigator !== "undefined" && !!navigator.vibrate;
  addEventListener("pointerdown", () => { autorise = true; }, { once: true });
  return (force = "leger") => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const motifs = { leger: 8, moyen: [0, 14], fort: [0, 10, 40, 18] };
    if (peutVibrer) { try { navigator.vibrate(motifs[force]); return; } catch (e) {} }
    if (!autorise) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = force === "fort" ? 112 : 168;
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(force === "leger" ? 0.035 : 0.06, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.06);
    } catch (e) {}
  };
})();

/* ═══ rendu ═══ */
function onglets() {
  $("#matieres").innerHTML = DOCS.map((d, i) =>
    `<button class="onglet" data-i="${i}" style="--ho:var(--h-${d.cle})"
       aria-current="${i === index}">${d.titre}</button>`).join("");
  document.querySelectorAll(".onglet").forEach(b =>
    b.onclick = () => aller(Number(b.dataset.i)));
}

function rendre(doc) {
  $("#m-titre").textContent = doc.titre;
  $("#m-sous").textContent = doc.sousTitre;
  const corps = $("#corps");
  corps.innerHTML =
    `<div class="page">
       <div class="entete"><h1>${doc.titre}</h1><p>${doc.sousTitre}</p></div>
       ${doc.sections.map((s, i) => `<section class="bloc" id="s${i}">${s.html}</section>`).join("")}
     </div>`;
  // les tableaux larges défilent dans leur propre conteneur
  corps.querySelectorAll("table").forEach(t => {
    const b = document.createElement("div"); b.className = "tableau";
    t.parentNode.insertBefore(b, t); b.appendChild(t);
  });
  $("#liste-sections").innerHTML = doc.sections.map((s, i) =>
    `<button data-s="${i}">${s.titre}</button>`).join("");
  document.querySelectorAll("#liste-sections button").forEach(b =>
    b.onclick = () => {
      haptique("leger"); fermer();
      $("#s" + b.dataset.s).scrollIntoView({ block: "start" });
    });
}

function aller(i, silencieux) {
  if (i < 0 || i >= DOCS.length || i === index) return;
  const doc = DOCS[i];
  if (!silencieux) haptique("moyen");

  const page = document.querySelector(".page");
  const suite = () => {
    index = i;
    document.body.style.setProperty("--h", `var(--h-${doc.cle})`);
    document.querySelectorAll(".onglet").forEach(b =>
      b.setAttribute("aria-current", Number(b.dataset.i) === i));
    rendre(doc);
    scrollTo({ top: 0, behavior: "instant" });
    $("#voile").classList.remove("actif");
    void $("#voile").offsetWidth;
    $("#voile").classList.add("actif");
    location.hash = doc.cle;
    document.querySelector(`.onglet[data-i="${i}"]`)
      ?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  };

  if (page && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    page.classList.add("sortie");
    setTimeout(suite, 150);
  } else suite();
}

/* ═══ navigation ═══ */
$("#b-prec").onclick = () => aller(index - 1);
$("#b-suiv").onclick = () => aller(index + 1);
$("#b-sections").onclick = () => { haptique("leger"); $("#panneau").classList.add("ouvert"); };
const fermer = () => $("#panneau").classList.remove("ouvert");
$("#panneau").onclick = e => { if (e.target.id === "panneau") fermer(); };

addEventListener("keydown", e => {
  if (e.key === "Escape") return fermer();
  if (e.target.closest("input,textarea")) return;
  if (e.key === "ArrowLeft") aller(index - 1);
  if (e.key === "ArrowRight") aller(index + 1);
});

/* balayage horizontal sur mobile */
let x0 = null, y0 = null;
addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.8) aller(index + (dx < 0 ? 1 : -1));
  x0 = y0 = null;
}, { passive: true });

/* progression de lecture */
addEventListener("scroll", () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $("#jauge").style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
}, { passive: true });

/* ═══ démarrage ═══ */
onglets();
const depart = DOCS.findIndex(d => d.cle === location.hash.slice(1));
index = -1;
aller(depart >= 0 ? depart : 0, true);
</script>
</body>
</html>
